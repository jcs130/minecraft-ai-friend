title = "Qiandengji source tree secret policy"
[extend]
useDefault = true

[[allowlists]]
description = "Exact JSON file fingerprints; not API credentials or arbitrary hex strings"
regexTarget = "line"
regexes = ['''^\s*"(?:apiSha256|previousApiSha256|numenApiPreserved(?:Sha256)?|credentials-after\.json|[^"\r\n]+\.(?:jar|java|class|py))"\s*:\s*"[a-f0-9]{64}"[,]?\s*$''']

[[allowlists]]
description = "Exact fixed tokenizer provenance expression; no file or directory exclusion"
regexTarget = "line"
regexes = [
  '''^\s*countTokens \? 'host-tokenizer' : 'utf8-byte-upper-bound'\);\s*$''',
  '''^\s*countTokens \? "host-tokenizer" : "utf8-byte-upper-bound"\s*$'''
]

[[allowlists]]
description = "One exact historical credentials-after receipt SHA256; never an API credential"
regexTarget = "line"
regexes = ['''^\s*"credentials-after\.json"\s*:\s*"81d72a6a48514588bf0c830fffa29cc64edf3320ffb04fdb2f6cd24ba1ce99b3"[,]?\s*$''']
