name: mc-world

# ============================================================
# 全量 Docker 化（2026-08-21 造物主最终拍板）
#   - 不放 vLLM（推理+视觉全走云端 QwenPaw provider）
#   - QwenPaw = 智能化管理世界的 AgentOS（核心，接 minecraft_companion MCP 操作世界）
#   - CPU embedding 模型内置进 ollama 镜像（自包含）
#   - minecraft_companion MCP（mindcraft-autoplayer）容器化，供 AgentOS 操作 MC 角色
# 用法：docker compose up -d --build
# ============================================================

x-mc-common: &mc-common
  restart: unless-stopped
  networks: [mc-net]

x-world-env: &world-env
  MC_HOST: mc-server
  MC_PORT: "25599"                 # mineflayer 直连 java 内网口（绕开皮肤代理）
  MC_RCON_HOST: mc-server
  MC_RCON_PORT: "25575"
  RCON_PASSWORD: ${RCON_PASSWORD:?请在 .env 设置 RCON_PASSWORD}
  MC_GOD_NAME: Goddess
  MC_MEMORY_ENABLED: "1"
  MC_QDRANT_URL: http://qdrant:6333
  MC_EMBEDDING_URL: http://ollama:11434
  MC_EMBEDDING_MODEL: ${MC_EMBEDDING_MODEL:-bge-m3-cpu:latest}
  QWENPAW_CONSOLE_URL: http://qwenpaw:8088/api/console/chat

services:
  # ---- 1. MC java 服务端（NeoForge 21.1.233 + numen + settlements） ----
  mc-server:
    <<: *mc-common
    build:
      context: .
      dockerfile: Dockerfile.mc-server
    image: mc-server-java:latest
    container_name: mc-server
    environment:
      RCON_PASSWORD: ${RCON_PASSWORD}
      JAVA_OPTS: ${JAVA_OPTS:--Xms2G -Xmx4G}
    volumes:
      - ${MC_SERVER_DATA_DIR:-C:/Users/lzl19/.copaw/workspaces/default/numen-sandbox}:/app/mc-server

  # ---- 2. 皮肤代理前门（:25565 -> mc-server:25599） ----
  skin-proxy:
    <<: *mc-common
    image: node:22-slim
    container_name: mc-skin-proxy
    command: ["node", "/app/skin-proxy.mjs"]
    environment:
      SKIN_LISTEN_PORT: "25565"
      SKIN_UPSTREAM_HOST: mc-server
      SKIN_UPSTREAM_PORT: "25599"
      MC_VERSION: ${MC_VERSION:-1.21.1}
      SKINS_FILE: /app/data/skins.json
      SKIN_PROXY_STAT: /app/data/skin-proxy-status.json
    volumes:
      - ./sidecar/skin-proxy.mjs:/app/skin-proxy.mjs:ro
      - mc-data:/app/data:ro
    ports:
      - "25565:25565"
    depends_on: [mc-server]

  # ---- 3. 世界进程（Goddess，唯一 RCON 持有者） ----
  world-process:
    <<: *mc-common
    build:
      context: .
      dockerfile: Dockerfile
    image: mc-world:latest
    container_name: mc-world-process
    environment:
      <<: *world-env
      MC_DATA_DIR: /app/data
    volumes:
      - mc-data:/app/data
    depends_on: [mc-server, qwenpaw, qdrant, ollama]

  # ---- 4. 观察面板（:9090） ----
  web-panel:
    <<: *mc-common
    image: mc-world:latest
    container_name: mc-panel
    command: ["node", "web-panel.mjs"]
    entrypoint: []
    environment:
      <<: *world-env
      MC_DATA_DIR: /app/data
    volumes:
      - mc-data:/app/data:ro
    ports:
      - "9090:9090"
    depends_on: [world-process]

  # ---- 5. 假玩家桥（guard-drive：身/魂桥接，纯 stdlib） ----
  guard-drive:
    <<: *mc-common
    image: python:3.12-slim
    container_name: mc-guard-drive
    working_dir: /app
    command: ["python", "-u", "/app/sidecar/guard/start_guard_drive.py"]
    environment:
      <<: *world-env
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./sidecar/guard:/app/sidecar/guard:ro
      - mc-data:/app/data
    depends_on: [mc-server, qwenpaw]

  # ---- 6. QwenPaw 智能层 AgentOS（服务器侧，管理世界的中枢；与宿主机 QwenPaw 并存） ----
  # 注意：宿主机 QwenPaw(8088) 是造物主的 AgentOS，mc-god 女神住在那里——不可停。
  # 本容器是【另一套】AgentOS，部署到服务器，承载世界侧 agent（亲卫/传令官/灶神/mc-god 分身），
  # 经 minecraft_companion MCP 操作世界；数据目录独立（QWENPAW_AGENTOS_DATA_DIR），不与宿主机 .copaw 共享。
  # 全新安装 qwenpaw → 数据根 ~/.qwenpaw（无 legacy 包袱），故挂载到 /root/.qwenpaw。
  qwenpaw:
    <<: *mc-common
    build:
      context: .
      dockerfile: Dockerfile.qwenpaw
    image: mc-qwenpaw:latest
    container_name: mc-qwenpaw
    environment:
      # SECRET_DIR 指到数据根内 secret/，provider 配置随数据卷一并挂载，免额外卷
      QWENPAW_SECRET_DIR: /root/.qwenpaw/secret
      # 服务器侧对外 AgentOS，必须开启鉴权（云端部署安全）
      QWENPAW_AUTH_ENABLED: "true"
      QWENPAW_AUTH_USERNAME: ${QWENPAW_AUTH_USERNAME:?请在 .env 设置 QWENPAW_AUTH_USERNAME}
      QWENPAW_AUTH_PASSWORD: ${QWENPAW_AUTH_PASSWORD:?请在 .env 设置 QWENPAW_AUTH_PASSWORD}
    volumes:
      - ${QWENPAW_AGENTOS_DATA_DIR:-C:/Users/lzl19/.qwenpaw-agentos}:/root/.qwenpaw
    ports:
      - "${QWENPAW_HTTP_PORT:-18088}:8088"   # 本地 18088 避开宿主机 QwenPaw(8088)；服务器部署设 8088
    depends_on: [autoplayer]

  # ---- 7. minecraft_companion MCP（mindcraft-autoplayer，:4177/mcp，AgentOS 操作世界的桥梁） ----
  autoplayer:
    <<: *mc-common
    build:
      context: ${AUTOPLAYER_DIR:-C:/Users/lzl19/Documents/Codex/2026-06-20/new-chat/mindcraft-autoplayer}
      dockerfile: ${AUTOPLAYER_DOCKERFILE:-C:/Users/lzl19/.copaw/workspaces/default/minecraft-ai-friend/Dockerfile.autoplayer}
    image: mc-autoplayer:latest
    container_name: mc-autoplayer
    environment:
      MINDCRAFT_AUTOPLAYER_PORT: "4177"
      MINDCRAFT_MCP_ALLOW_LAN: "false"
    volumes:
      - ${AUTOPLAYER_DIR:-C:/Users/lzl19/Documents/Codex/2026-06-20/new-chat/mindcraft-autoplayer}/data:/app/data
    ports:
      - "4177:4177"   # 供宿主侧调试/宿 QwenPaw 过渡期访问；稳定后仅内网

  # ---- 8. ollama（embedding :11434，模型已内置镜像，自包含） ----
  ollama:
    <<: *mc-common
    build:
      context: .
      dockerfile: Dockerfile.ollama
      args:
        EMBED_MODEL: ${MC_EMBEDDING_MODEL:-bge-m3-cpu:latest}
    image: mc-ollama:latest
    container_name: mc-ollama
    ports:
      - "11434:11434"   # 可选对外（世界进程走内网即可）

  # ---- 9. qdrant（世界向量库 :6333，仅内网，独立于 MemOS） ----
  qdrant:
    <<: *mc-common
    image: qdrant/qdrant:v1.15.3
    container_name: mc-qdrant
    volumes:
      - qdrant-data:/qdrant/storage

networks:
  mc-net:
    driver: bridge

volumes:
  mc-data:
    external: true   # 已有完整世界数据（world.db/chronicle/magic-state/skins/transmigrators 等）
  qdrant-data:
