combat_basic:
  title: 冒险战技认证
  description: 开考后成功施放一次Vortex职业技能，并真实击杀一只敌对怪物。只发命令、施法失败或杀动物不算；新旧背包和装备不清空。
  primitive: native_lesson
  proofs: [native_cast, native_kill]
  all-proofs: true
  reuse-training: false
  timeout-seconds: 1800
conquest_basic:
  title: 副本攻略认证
  description: 开考后新开一场遗迹副本，逐室实际参战并完整通关，服务器自动登记证明，无需返回首室。每日奖励上限不影响考试；传送与重连保留原考试和截止时间。抵达入口、旁观或领取旧奖励不算；用 /mycli guild exam status 核对，ready 后提交。
  primitive: contract_record
  proofs: [native_clear]
  all-proofs: true
  reuse-training: false
  timeout-seconds: 86400
