        text: 第一层在aincrad世界；travel到前哨(856,69,-1144)，沿东墙向北到低拱(844,69,-1210)开场。低拱→北廊→柱廊→南拱→上层看台→中央首领，共六段；上层从东南原石梯绕行，status给当前路线。建议Lv.5、铁甲、职业武器、盾和治疗，2–3人分工更稳。清完回低拱首室，再claim入个人箱。
