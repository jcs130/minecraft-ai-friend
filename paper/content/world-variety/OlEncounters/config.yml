    event:
      enabled: true
      title: '&6&lEtkinlik Komutları'
      commands:
        - '&e/olencounters baslat <tip> [dünya] [yarıçap] &7- Meteor başlatır'
        - '&e/olencounters konumdabaslat <tip> <konum> [dünya] [mod] &7- Belirlenen konumda başlatır'
        - '&e/olencounters durdur <id> &7- Güvenli biçimde bitirip alanı geri yükler'
        - '&e/olencounters liste &7- Aktif meteorları gösterir'
        - '&e/olencounters bilgi <id> &7- Meteor ayrıntılarını gösterir'
        - '&e/olencounters gecmis [adet] &7- Çarpma saati, konumu ve sonucunu gösterir'
    setup:
      enabled: true
