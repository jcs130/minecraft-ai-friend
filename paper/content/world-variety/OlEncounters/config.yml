      enabled: true
      title: '&c&lYönetim Komutları'
      commands:
        - '&e/olencounters yenile &7- Ayarları yeniler'
        - '&e/olencounters iptal <id> &7- Etkinliği iptal eder'
        - '&e/olencounters otomatik durum &7- Otomatik meteor planını gösterir'
        - '&e/olencounters otomatik &7- Oyun içi otomatik ayar menüsünü açar'
        - '&e/olencounters otomatik ac|kapat &7- Otomatik sistemi açar veya kapatır'
        - '&e/olencounters otomatik simdi &7- Hemen rastgele meteor başlatır'
        - '&e/olencounters kontrol &7- Entegrasyon ve kurtarma durumunu kontrol eder'
        - '&e/olencounters onizleme <meteor> &7- Alanı blok koymadan önizler'
        - '&e/olencounters istatistik [oyuncu] &7- Kalıcı meteor istatistiklerini gösterir'
        - '&e/olencounters bilet <oyuncu> <meteor> [adet] &7- Güvenli çağırma bileti verir'
        - '&e/olencounters otomatik ayarla <meteorlar> <dünya> <preset> <minDk> <maxDk> <minUzaklık> <maxUzaklık> [minY] [maxY]'
        - '&e/olencounters otomatik kategori ekle <kategori> <meteor> [ağırlık] &7- Kategori oluşturur veya meteor ekler'
        - '&e/olencounters otomatik kategori cikar <kategori> <meteor> &7- Meteoru kategoriden çıkarır'
        - '&e/olencounters otomatik kategori sematikekle <kategori> <şematik> [ağırlık] &7- Özel şematik ekler'
        - '&e/olencounters otomatik kategori sematikcikar <kategori> <şematik> &7- Özel şematiği çıkarır'
        - '&e/olencounters otomatik kategori sil <kategori> &7- Otomatik kategoriyi siler'
        - '&e/olencounters otomatik kategori liste &7- Otomatik kategorileri gösterir'
        - '&e/olencounters konumpreseti <isim> [minY] [maxY] &7- Spawn konum presetini seçer'
automatic-events:
  min-distance-from-spawn: 600
  max-distance-from-spawn: 3000
  search-shape: CIRCLE
  tps-guard:
    enabled: true
    minimum-tps: 18
    retry-minutes: 5
  location-cooldown:
    enabled: true
    radius: 1000
    hours: 24
  max-active-events: 1
  default-location-preset: flat_surface
  world-settings: {}
location-finder:
  presets:
    flat_surface:
      mode: surface
      require-flat: true
      allow-water: false
      allow-lava: false
      min-y: -64
      max-y: 320
      allowed-floor-blocks: []
    water_surface:
      mode: surface
      require-flat: true
      allow-water: true
      allow-lava: false
      min-y: 50
      max-y: 320
      allowed-floor-blocks: []
    underground:
      mode: underground
      require-flat: false
      allow-water: true
      allow-lava: false
      min-y: -48
      max-y: 40
      allowed-floor-blocks: []
    air:
      mode: air
      require-flat: false
      allow-water: true
      allow-lava: true
      min-y: 100
      max-y: 220
      allowed-floor-blocks: []
    any_surface:
      mode: surface
      require-flat: false
      allow-water: false
      allow-lava: false
      min-y: -64
      max-y: 320
      allowed-floor-blocks: []
    grass_surface:
      mode: surface
      require-flat: true
      allow-water: false
      allow-lava: false
      min-y: 55
      max-y: 320
      allowed-floor-blocks:
        - GRASS_BLOCK
        - DIRT
        - COARSE_DIRT
        - PODZOL
        - MOSS_BLOCK
    desert_surface:
      mode: surface
      require-flat: true
      allow-water: false
      allow-lava: false
      min-y: 45
      max-y: 320
      allowed-floor-blocks:
        - SAND
        - RED_SAND
        - SANDSTONE
        - RED_SANDSTONE
    nether_surface:
      mode: surface
      require-flat: false
      allow-water: false
      allow-lava: false
      min-y: 20
      max-y: 120
      allowed-floor-blocks:
        - NETHERRACK
        - SOUL_SAND
        - SOUL_SOIL
        - BLACKSTONE
        - BASALT
    end_surface:
      mode: surface
      require-flat: true
      allow-water: false
      allow-lava: false
      min-y: 0
      max-y: 200
      allowed-floor-blocks:
        - END_STONE
  advanced-search:
    batch-size: 1
    concurrent-candidate-hard-limit: 1
    allow-chunk-generation: false
    max-chunks-per-search: 32
    timeout-millis: 8000
    batch-delay-ticks: 5
    sample-grid-size: 5
    expansion-stages: 5
    world-border-margin: 32
    expand-any-surface-y: true
event:
  tickets:
    material: FIRE_CHARGE
    cooldown-seconds: 300
  waves:
    enabled: true
    count: 3
    interval-seconds: 15
  recovery:
    enabled: true
    capture-padding:
      horizontal: 1
      below: 1
      above: 3
    max-snapshot-blocks: 64000
  tracking:
    enabled: true
    max-distance: 2000
  chunk-force-load-radius: 1
  combat-feedback:
    damage-actionbar-text: '&e本次伤害 %damage%'
    kill-actionbar-text: '&a击败敌人，剩余 %remaining%'
    leaderboard-title: '&6同行战绩'
    leaderboard-entry: '&e%player% &7伤害 %damage%'
    leaderboard-empty: '&7暂无参战记录'
    leaderboard-size: 3
  fall:
    normal-height: 80
    slow-height: 120
    show-impact-core: false
  schematic-animation:
    enabled: false
    max-display-blocks: 400
    batch-size: 40
    layer-stagger-ticks: 8
    fallback-to-core: true
  performance-guard:
    animation-display-hard-limit: 500
    animation-view-range: 96
    max-animation-chunks: 32
  hazards:
    radiation-enabled: false
    wind-enabled: false
    radiation-damage-per-second: 2
    wind-charge-knockback-multiplier: 1.5
    wind-charge-interval-ticks: 100
    disable-elytra: true
    disable-ender-pearl: true
  vault:
    key-enabled: true
    reward-mode: KEY
    boss-damage-threshold-percent: 10
    open-delay-ticks: 100
messages:
  command:
    help:
      title: '&6&l=== OlEncounters Help ==='
      usage: |
        &e/olencounters help &7- Display this help message
        &e/olencounters setup <type> &7- Enter visual setup mode
        &e/olencounters start <type> [world] [radius] &7- Start a meteor event
        &e/olencounters spawnat <type> <xyz> [world] &7- Start at coordinates
        &e/olencounters stop <id> &7- Stop and rollback an event
        &e/olencounters cancel <id> &7- Cancel an event immediately
        &e/olencounters reload &7- Reload configuration
        &e/olencounters wand &7- Receive the setup wand
        &e/olencounters list &7- List active events
        &e/olencounters info <id> [target] &7- Show event details
    reload:
      success: '&a野外遭遇基础配置已重新读取；方案配置用 /worldvariety reload。'
    wand:
      success: '&aSetup wand has been added to your inventory.'
    player_only: '&cThis command can only be executed by a player.'
    no_permission: '&c这是房管操作。普通玩家用 /mycli world events 查看并到场参加。'
    setup:
      usage: '&eUsage: /olencounters setup <type>'
      available_types: '&7Available types: %types%'
      invalid_type: '&cInvalid meteor type: &e%type%'
    start:
      usage: '&eUsage: /olencounters start <type> [world]'
      invalid_type: '&cInvalid meteor type: &e%type%'
      scheduled: '&a野外遭遇 %eventId% 已安排在 %location%。'
      error: '&cAn error occurred while starting the event: %error%'
      fawe_required: '&c建筑与回退服务未就绪，本次没有生成遭遇；请房管检查 WorldEdit 服务。'
      location_fail: '&e暂未找到安全空地，本次没有生成遭遇；稍后再查 /mycli world events。'
      world_not_found: '&cWorld ''%world%'' not found.'
    stop:
      usage: '&eUsage: /olencounters stop <eventId>'
      no_event: '&cNo active event found with ID: &e%eventId%'
      success: '&a遭遇 %eventId% 正在安全收尾。'
    cancel:
      usage: '&eUsage: /olencounters cancel <eventId>'
      no_event: '&cNo active event found with ID: &e%eventId%'
      success: '&e遭遇 %eventId% 已取消。'
    list:
      title: '&6当前野外遭遇'
      empty: '&7当前没有野外遭遇。'
      entry: '&e%eventId% &f%world% %location%'
    info:
      title: '&6&l=== Meteor Event Info ==='
      no_event: '&cNo active event found with ID: &e%eventId%'
      id: '&7ID: &f%eventId%'
      type: '&7Type: &f%type%'
      phase: '&7Phase: &f%phase%'
      world: '&7World: &f%world%'
      location: '&7Location: &f%location%'
      radius: '&7Radius: &f%radius% blocks'
      radius_shape: '&7Radius shape: &f%shape%'
      schematic: '&7Schematic: &f%schematic%'
      distance: '&7Distance to &e%player%&7: &f%distance% blocks'
    spawnat:
      usage: '&eUsage: /olencounters spawnat <type> <x> <y> <z> [world]'
  display:
    vault_hologram: '&6&l✦ Vault &7| &eKeys: &f%count%'
  item:
    meteor_key:
      name: '&6&l✦ Meteor Key'
      lore: |
        &7A key forged from celestial fragments.
        &7Used to unlock the Meteor Vault.

        &6✦ Meteor Type: &e%meteor_type%
        &7✦ &8One-time use
        &7✦ &8Personal loot only

        &e&lRight-click on the Meteor Vault to open!
    setup_wand:
      name: '&6&l✦ Meteor Setup Wand'
      lore: |
        &6&l=== Region Selection Tool ===
        &eLeft Click &7- Set position 1
        &eRight Click &7- Set position 2

        &7Select the area where the
        &7meteor will impact.
