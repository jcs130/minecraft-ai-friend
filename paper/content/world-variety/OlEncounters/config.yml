basic-settings:
  integrations:
    nbt-api-enabled: true
  schematic:
    default: qd_forest_camp.schem
  location:
    preset: any_surface
    max-attempts: 40
    terrain-variance: 5
    claim-buffer: 50
    block-worldguard-regions: true
    require-towny-wilderness: true
  event:
    cleanup-delay-seconds: 60
    unattended-timeout-minutes: 30
    damage-actionbar: true
    kill-actionbar: true
    leaderboard: true
    loot-block: ANCIENT_DEBRIS
    reward-top-count: 3
  performance-profile: SAFE
  language: en
  automatic-events:
    interval-minutes:
      minimum: 30
      maximum: 60
    worlds: []
    meteor-types:
      - small
      - medium
      - large
    enabled: false
    categories:
      default:
        enabled: true
        weight: 1
        meteors:
          small: 1
          medium: 1
          large: 1
          epic: 1
          legendary: 1
modules:
  disabled: []
  enabled: false
meteor-types:
  small:
