    announcement: '<gold>[公会集结·试炼塔]</gold> <gray>召集10分钟，可单人或结伴；主世界world（-596,92,-313）。可直接用传送魔法 /mycli goto arena（成功耗6魔力）到集结入口，不必徒步，穿齐四甲、带武器；伙伴到按钮12格内，一人 /mycli arena start（免费）。每次新开从第1层开始，历史通关不自动跳层；清层自动下楼。/mycli arena status 查下一步，活动不自动报名。</gray>'
