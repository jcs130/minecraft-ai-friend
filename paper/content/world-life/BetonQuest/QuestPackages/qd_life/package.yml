conversations:
  mentor:
    quester: 旅途导师·小满
    first: welcome
    NPC_options:
      welcome:
        text: 我是小满。准备好装备和补给，就出发探索村外吧！近郊调查、野外讨伐、试炼塔和遗迹地下城都可选；先 /mycli tasks list exploration 或 tasks list combat 看路线。
        pointers: routes,magic,life,season,rescue,bye
      routes:
        text: tasks list 看路线，tasks list combat/crafting/exploration/supply/engineering/life 看任务，再 tasks info ID 查条件；guild accept ID 接单，每阶段 guild claim。guild shared 查门口公共箱按需拿装备和补给，门内私产别取。三证实习的最后一项任选一张完整交付，生活旧证明也保留。
        pointers: back,bye
      magic:
        text: 先 world guide start，再 skills list common，亲手成功施法，最后完整交付任选路线委托。tasks list 选路线，旧技能资格保留，新学和升级花技能点；成功施法仍要资源与冷却。
        pointers: back,bye
      life:
        text: 把发现写成游记、用女神相机拍照，都能留下旅途故事。/mycli world board 看近郊调查，world shops 查补给商；公共箱用 guild shared，个人试炼箱在技能罗盘首页。
        pointers: back,bye
      rescue:
        text: 组队试炼队友倒地后，同队存活者在4格内连续停留10秒就能扶起。清完本层或本室也能复活；全队倒地才失败。
        pointers: back,bye
      season:
        text: 最近是千灯探险季：近郊巡访、林道营地讨伐、普通试炼与遗迹调查。先 tasks info <ID> 看阶段，再 guild accept <ID>；每阶段 guild claim。出发用 guild shared 取装备，照片用罗盘相机，结算奖励进入个人箱。
        pointers: back,bye
    player_options:
      routes:
        text: 我想打怪、造装备或去探索。
        pointers: routes
      magic:
        text: 怎样使用技能？
        pointers: magic
      life:
        text: 我想记录旅途和寻找补给。
        pointers: life
      rescue:
        text: 怎样救队友？
        pointers: rescue
      back:
        text: 再问一件事。
        pointers: welcome
      bye:
        text: 谢谢，我去实际试试！
      season:
        text: 大家最近在忙什么？
        pointers: season
