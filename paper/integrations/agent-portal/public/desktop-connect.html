<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>登录千灯纪 · N.E.K.O.</title>
  <link rel="stylesheet" href="/maid-connect-trial.css">
  <link rel="stylesheet" href="/resident-connect.css">
  <script type="module" src="/desktop-connect.mjs"></script>
</head>
<body><main>
  <a class="brand" href="/">千灯纪</a>
  <h1 id="title">授权 N.E.K.O.</h1>
  <p id="message" role="status">正在读取登录状态…</p>
  <form id="login" hidden>
    <label>网站用户名或邮箱<input name="username" autocomplete="username" required maxlength="254"></label>
    <label>网站密码<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label>
    <button>登录并继续</button>
    <p><a href="/join" target="_blank" rel="noopener noreferrer">使用其他登录方式</a>，登录后返回此页。</p>
  </form>
  <form id="consent" hidden>
    <p id="device"></p>
    <label>游戏角色<select id="character" required></select></label>
    <p id="binding"></p>
    <p>允许这台设备查看所选角色的身体和控制状态，续期，并在你点「开始游玩」后控制该角色。</p>
    <label id="migration" hidden><input id="migrate" type="checkbox">迁移这个角色的原居民插件授权。新插件开始游玩时交接原身体。</label>
    <label id="cross-device" hidden>另一台设备显示的六位码<input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off"></label>
    <button id="approve" disabled>同意并返回 N.E.K.O.</button>
  </form>
  <section id="devices" hidden><h2>已授权设备</h2><ul id="device-list"></ul></section>
  <p id="manage"><a href="/desktop-connect.html">管理设备授权</a></p>
</main></body>
</html>
