<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>女仆连接 · 千灯纪</title><link rel="icon" href="/assets/lantern.svg"><link rel="stylesheet" href="/maid-connect-trial.css"><script type="module" src="/maid-connect-trial.mjs"></script></head>
<body><main><a class="brand" href="/"><img width="32" height="32" src="/assets/lantern.svg" alt="">千灯纪</a>
<h1>连接你的 N.E.K.O.</h1><p id="status" role="status">正在读取临时托管状态…</p>
<section id="start" hidden><h2>从悠怡发起连接</h2><ol><li>在测试电脑解压服主私发的托管包，按包内说明启动原来的悠怡。</li><li>打开酒狐插件的「官网授权」，使用它给出的专属链接和六位连接码。</li><li>在打开的页面选取包内的「官网邀请.txt」并确认。连接成功后，回到插件查看身体状态。</li></ol></section>
<form id="consent" hidden><h2 id="role">确认托管</h2><p id="scope"></p><label>酒狐显示的六位连接码<input name="code" maxlength="6" pattern="[A-Fa-f0-9]{6}" autocomplete="off" autocapitalize="characters" spellcheck="false" required></label><label>托管包中的「官网邀请.txt」<input name="invite" type="file" accept=".txt" required></label><button>同意本次托管</button></form>
<p id="result" role="status" aria-live="polite"></p></main></body></html>
