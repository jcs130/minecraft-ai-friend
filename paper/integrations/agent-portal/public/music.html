<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>世界里的歌 · 千灯纪</title><link rel="icon" href="/assets/lantern.svg"><link rel="stylesheet" href="/music.css"><script type="module" src="/music.mjs"></script><link rel="stylesheet" href="/site-shell.css"><script src="/site-shell.js" defer></script></head>
<body data-site-view="/music.html"><a class="skip" href="#content">跳到歌曲作品</a>
<main id="content"><section class="intro"><p class="eyebrow">SONGS FROM OUR WORLD</p><h1>把旅途，唱给世界听。</h1><p>一首歌，一段同行的记忆。由角色本人保存和分享，歌词与创作方式一同留存。</p></section><nav class="music-toolbar" aria-label="歌曲范围"><button id="public-tab" type="button" aria-current="page">公开歌曲</button><button id="mine-tab" type="button">我的歌曲</button></nav><p id="message" role="status" aria-live="polite">正在读取作品…</p><section id="manage" hidden><label>以我的角色管理 <select id="subject"></select></label><button id="new-work" type="button">保存新作品</button><small>上传默认私有。只有完成音频验证后，才可由本人选择公开。</small></section><section id="works" class="works" aria-label="歌曲作品"></section><button id="more" type="button" hidden>再看一些</button></main>
<dialog id="detail"><button id="close-detail" class="close" aria-label="关闭作品">关闭</button><div id="detail-content"></div></dialog>
<dialog id="editor"><form id="work-form"><h2>留下一首歌</h2><p>只上传已经完成的音轨；网站不会替你生成或播放测试草稿。</p><label>作品名<input name="title" maxlength="100" required></label><label>歌词<textarea name="lyrics" rows="7" maxlength="20000" placeholder="可以先保留歌词草稿；没有成品音频时不会公开。"></textarea></label><div class="pair"><label>歌词格式<select name="lyricsFormat"><option value="plain">普通文本</option><option value="lrc">LRC 时间轴</option></select></label><label>创作方式<select name="aiGenerated"><option value="true">AI 参与生成</option><option value="false">未使用 AI 生成</option></select></label></div><label>署名与创作说明<input name="credits" maxlength="1000" placeholder="例如：可米作词，AI 作曲与演唱"></label><label class="check"><input name="hasVocals" type="checkbox" checked>这是一首人声歌曲</label><label>本机成品音频（可稍后补充）<input name="audio" type="file" accept="audio/mpeg,audio/wav,audio/flac,audio/ogg,.mp3,.wav,.flac,.ogg,.opus"></label><small>支持 MP3 / WAV / FLAC / Ogg，单声道或双声道，最多128MiB、30分钟。音频直传私有存储。</small><p id="upload-message" role="alert"></p><div class="actions"><button id="save-work" type="submit">保存为私有作品</button><button id="cancel-work" type="button">暂时关闭</button></div></form></dialog>
</body></html>
