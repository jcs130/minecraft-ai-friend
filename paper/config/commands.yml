command-block-overrides: []
ignore-vanilla-permissions: false
aliases:
  # Keep all three vanilla private-message names independent of plugin load
  # order. Essentials may retain a disabled /msg command in the command map.
  msg:
  - minecraft:msg $1-
  tell:
  - minecraft:msg $1-
  w:
  - minecraft:msg $1-
  icanhasbukkit:
  - version $1-
  backpack:
  - minepacks:backpack $1-
  bp:
  - minepacks:backpack $1-
  questbag:
  - betonquest:backpack $1-
