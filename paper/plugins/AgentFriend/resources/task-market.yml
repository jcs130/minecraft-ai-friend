# Hot operations: mycli admin market reload, then register <siteID> before construction.
# A site requires world, min/max [x,y,z], materials, deck-y; bridge: start/end;
# mechanism: components {MATERIAL: count}, outputs [{at: [x,y,z], material: REDSTONE_LAMP}].
# Bounds/materials of registered sites are immutable. Use new IDs for new work.
# Optional BUILD project handover: {land-id: <stable ID>, site: <this task's BUILD site>, landmark: true}.
# Verified final completion grants the site to its contractor; owner publishes a safe public landing in-game.
schema-version: 1
sites: {}
tasks:
  sword_arc_trial:
    scope: personal
    repeat: once
    profession: warrior
    title: 剑路初试
    description: 用真实近战与正面格挡证明剑士基础，学会保护同行的弧光斩。
    icon: IRON_SWORD
    reward: {fame: 8, emeralds: 3, bonus: BREAD, bonus-count: 2}
    steps:
      - {title: 持剑迎敌, description: 持剑在四格内亲自击败三名不同敌人；只计真实击杀，不计查询和挥空。, goal: melee_kills, target: 3}
      - {title: 两次有效格挡, description: 架势准备后挡住两次正面怪物近战；仅准备不算进度。, goal: parry, target: 2}
  sword_road_trial:
    scope: personal
    repeat: once
    profession: warrior
    requires-skills: [sword_arc]
    title: 剑士同行之路
    description: 从独自战斗走向组队远征，学习步法斩和剑气。
    icon: RABBIT_FOOT
    reward: {fame: 12, emeralds: 4, bonus: GOLDEN_APPLE, bonus-count: 1}
    steps:
      - {title: 苔径磨剑, description: 亲自通关试炼第三层。, goal: floor, target: 1, floor: 3}
      - {title: 海渊同行, description: 与至少一名生存队友共同通关第五层。, goal: party_floor, target: 1, floor: 5}
  twin_legacy_trial:
    scope: personal
    repeat: once
    profession: warrior
    requires-skills: [sword_arc, sword_step]
    title: 传承·星流双剑
    description: 经历有效格挡、组队首领和深层首领后，获得有来历的双剑觉醒。
    icon: NETHERITE_SWORD
    reward: {fame: 24, emeralds: 8, bonus: DIAMOND, bonus-count: 1}
    steps:
      - {title: 五次化解, description: 实际挡住五次正面怪物近战；格挡架势消耗魔力。, goal: parry, target: 5}
      - {title: 宝库同袍, description: 至少两名队友共同通关第六层首领。, goal: party_floor, target: 1, floor: 6}
      - {title: 深层见证, description: 亲自通关第十层首领，留下不同首领层履历。, goal: floor, target: 1, floor: 10}
      - {title: 归途磨剑, description: 亲自持剑近战击败八名不同敌人。, goal: melee_kills, target: 8}
  healer_trial:
    scope: personal
    repeat: once
    profession: priest
    title: 灯火同行
    description: 抚愈受怪物伤害的同伴，并一起完成试炼，学习灯火群愈。
    icon: BEACON
    reward: {fame: 12, emeralds: 4, bonus: HONEY_BOTTLE, bonus-count: 2}
    steps:
      - {title: 为同伴抚愈, description: 为其他生存玩家实际恢复二十四点近两分钟内的怪物伤量；自疗、摔伤和过量治疗不计。, goal: healing, target: 24}
      - {title: 苔径同行, description: 至少两名生存玩家共同通关第三层。, goal: party_floor, target: 1, floor: 3}
  mage_trial:
    scope: personal
    repeat: once
    profession: mage
    title: 法师·元素之路
    description: 用魔法标记协助战斗，亲自调查下界并返回，学会炎流与秘法巡望。
    icon: SPYGLASS
    reward: {fame: 14, emeralds: 5, bonus: ARROW, bonus-count: 12}
    steps:
      - {title: 秘法协战, description: 八秒标记内由本人或近旁生存队友击败三名不同敌人；施法者须在三十二格内。, goal: mark_kills, target: 3}
      - {title: 下界路线调查, description: 实际走查下界四个不同区域、至少六十四格新路线和二十秒有效行进，传送或站定不算。, goal: dimension, dimension: nether, target: 4, zone-size: 16, min-distance: 64, min-seconds: 20}
      - {title: 带回见闻, description: 从下界实际返回主世界，再交付这段远行履历。, goal: return, dimension: overworld, target: 1}
  east_gully_bridge:
    enabled: false
    scope: project
    title: 村东沟壑架桥
    description: 勘察两岸、备料并架起真正可走的公共桥；场地勘察登记后开放。
    beneficiary: 来往村庄的居民
    icon: OAK_PLANKS
    reward: {fame: 18, emeralds: 8, bonus: BREAD, bonus-count: 6}
    steps:
      - {title: 架桥, description: 新增至少 24 格合规桥面并连通两岸锚点，头顶留两格通道。, goal: bridge, site: east_gully, target: 24}
  north_stone_road:
    enabled: false
    scope: project
    title: 村北泥路铺石
    description: 将勘察登记的泥路带铺成通畅石路。
    icon: STONE_BRICKS
    reward: {fame: 14, emeralds: 6, bonus: TORCH, bonus-count: 8}
    steps:
      - {title: 铺路, description: 指定路面带至少 80% 的格子是新增的合规可通行路面。, goal: road, site: north_road, target: 80}
  guild_approach_road:
    enabled: false
    scope: project
    title: 公会门外引路铺装
    description: 铺好公共箱外侧的新引路，不改萌萌公会内物品和原有建筑。
    icon: ANDESITE
    reward: {fame: 14, emeralds: 6, bonus: BREAD, bonus-count: 4}
    steps:
      - {title: 铺装, description: 指定路面带至少 80% 为新增合规路面，保持两格净空。, goal: road, site: guild_approach, target: 80}
  guild_gate_machine:
    enabled: false
    scope: project
    title: 公会门外自动门示范
    description: 在独立公共示范区造机关；禁止拆公会受保护的原门体。
    icon: PISTON
    reward: {fame: 24, emeralds: 10, bonus: REDSTONE, bonus-count: 8}
    steps:
      - {title: 装置调试, description: 新增构件清单并亲手操作场内按钮或拉杆，让每个目标实际通断。, goal: redstone, site: guild_gate_demo, target: 1}
  village_watch_post:
    enabled: false
    scope: project
    handover: {land-id: village_watch_post, site: watch_post, landmark: true}
    title: 村口瞭望岗亭
    description: 在勘察空地建造一座木石小岗亭，供巡逻者休息。
    icon: OAK_LOG
    reward: {fame: 18, emeralds: 8, bonus: LANTERN, bonus-count: 2}
    steps:
      - {title: 建岗亭, description: 场地内新增至少 32 格白名单建筑方块；泥土和掉落物不计。, goal: build, site: watch_post, target: 32}
  retractable_bridge:
    enabled: false
    scope: project
    title: 可收放吊桥
    description: 先架桥再调试机械；两阶段均验收后才领取工程赏金。
    icon: STICKY_PISTON
    reward: {fame: 40, emeralds: 18, bonus: IRON_INGOT, bonus-count: 8}
    steps:
      - {title: 连通桥面, description: 新增 24 格合规桥面并连通两岸，留出净空。, goal: bridge, site: drawbridge, target: 24}
      - {title: 调试机关, description: 安装全套新增构件，操作场内按钮或拉杆，记录各目标真实通断。, goal: redstone, site: drawbridge, target: 1}
  fishing_picnic:
    scope: personal
    title: 河边野餐
    description: 钓一次鱼，再给门口公共补给箱送一点面包。
    beneficiary: 今天出门的伙伴
    icon: FISHING_ROD
    reward: {fame: 8, emeralds: 3, bonus: COOKED_COD, bonus-count: 2}
    steps:
      - {title: 河边垂钓, description: 亲手钓上 1 条鱼，可自由选择地点。, goal: fish, item: ANY_FISH, target: 1}
      - {title: 分享野餐, description: 交付 2 个普通面包，服务器将放进门口公共补给箱。, goal: donate, item: BREAD, chest: supplies, target: 2}
  lantern_evening:
    scope: personal
    title: 为夜归的人点灯
    description: 亲手制作照明物并把灯放到允许建设的地方。
    icon: TORCH
    reward: {fame: 10, emeralds: 4, bonus: BREAD, bonus-count: 3}
    steps:
      - {title: 制作火把, description: 亲手合成火把 2 次；计算合成动作次数。, goal: craft, item: TORCH, target: 2}
      - {title: 点亮夜路, description: 在有权限的地方放置 4 个火把或灯笼；被保护拒绝的不计。, goal: lanterns, target: 4}
  shared_tools:
    scope: personal
    title: 给新伙伴备工具
    description: 做一把石镐并存进公共杂物箱，方便刚到村庄的伙伴。
    icon: STONE_PICKAXE
    reward: {fame: 8, emeralds: 3, bonus: BREAD, bonus-count: 2}
    steps:
      - {title: 制作石镐, description: 亲手合成 1 次石镐。, goal: craft, item: STONE_PICKAXE, target: 1}
      - {title: 放进公共箱, description: 交付 1 把全新普通石镐，送入公共杂物箱。, goal: donate, item: STONE_PICKAXE, chest: misc, target: 1}
  hill_walk:
    scope: personal
    title: 登高看日落
    description: 选一个喜欢的山顶，看一眼远方；可以慢慢走。
    icon: LEATHER_BOOTS
    reward: {fame: 6, emeralds: 2, bonus: APPLE, bonus-count: 2}
    steps:
      - {title: 登高, description: 到达高度至少 120 的地方；服务器记录实际到达。, goal: peak, target: 1}
  companion_trial:
    scope: personal
    title: 结伴练习
    description: 和伙伴一起挑战，再领取属于自己的试炼奖励。
    icon: SHIELD
    reward: {fame: 12, emeralds: 5, bonus: COOKED_BEEF, bonus-count: 4}
    steps:
      - {title: 共同过关, description: 至少两位队员一起通关第 2 层。, goal: party_floor, floor: 2, target: 1}
      - {title: 收好战利品, description: 从个人试炼奖励箱实际领取一次奖励。, goal: claims, target: 1}
  ruins_journal:
    scope: personal
    title: 遗迹见闻
    description: 亲自到亡者古墓看看，再给公共箱补上远行照明。
    icon: SPYGLASS
    reward: {fame: 12, emeralds: 5, bonus: EXPERIENCE_BOTTLE, bonus-count: 3}
    steps:
      - {title: 遗迹踏查, description: 到达亡者古墓；可 guild travel undead_crypt 使用耗魔远征术。, goal: explore, site: undead_crypt, target: 1}
      - {title: 留下补给, description: 交付 8 个普通火把，进入门口公共补给箱。, goal: donate, item: TORCH, chest: supplies, target: 8}
  nether_field_journal:
    scope: personal
    repeat: once
    title: 灯火越过红门
    description: 穿过下界之门，走查熔岩彼岸的地貌与至少两种生物群系，再带着见闻回到主世界。
    beneficiary: 千灯纪远行档案馆
    icon: OBSIDIAN
    reward: {fame: 24, emeralds: 8, bonus: GOLDEN_APPLE, bonus-count: 2}
    steps:
      - {title: 下界地貌调查, description: 自备黑曜石与点火工具，标记返程门；走出门前区域，调查两种群系的不同地带。, goal: dimension, dimension: nether, target: 16, zone-size: 16, min-distance: 384, min-seconds: 120, min-biomes: 2}
      - {title: 带回红门见闻, description: 探索完成后返回主世界；可使用原版传送门或已经学会且支付代价的返程技能。, goal: return, dimension: overworld, target: 1}
  nether_fortress_survey:
    scope: personal
    repeat: once
    title: 黑砖回廊的回声
    description: 调查下界要塞的桥廊与内部通路，辨清多处区段后返程；带好防火与补给。
    icon: NETHER_BRICKS
    reward: {fame: 28, emeralds: 10, bonus: GOLDEN_APPLE, bonus-count: 2}
    steps:
      - {title: 要塞通路勘察, description: 自行寻找自然下界要塞，深入桥廊和内厅的不同区段；门口站定不能完成。, goal: structure, dimension: nether, structure: 'minecraft:fortress', target: 12, min-distance: 128, min-seconds: 60, min-sections: 4}
      - {title: 返回灯下, description: 保留调查记录，返回主世界。, goal: return, dimension: overworld, target: 1}
  bastion_old_covenant:
    scope: personal
    repeat: once
    title: 金色废垒的旧约
    description: 探索堡垒遗迹的残墙和内层通道；猪灵蛮兵不会因金甲而友善，避险后带回路线。
    icon: POLISHED_BLACKSTONE_BRICKS
    reward: {fame: 30, emeralds: 12, bonus: GOLDEN_APPLE, bonus-count: 2}
    steps:
      - {title: 堡垒内部调查, description: 走查同一座自然堡垒的多处内部区段，观察路线并保留退路，不要求抢夺宝箱。, goal: structure, dimension: nether, structure: 'minecraft:bastion_remnant', target: 12, min-distance: 80, min-seconds: 50, min-sections: 4}
      - {title: 废垒归来, description: 完成调查后返回主世界。, goal: return, dimension: overworld, target: 1}
  crimson_forest_trail:
    scope: personal
    repeat: once
    title: 绯红林海的路标
    description: 调查绯红森林的连续地带，辨认菌树与危险生灵，亲自走出一条调查路线后返程。
    icon: CRIMSON_FUNGUS
    reward: {fame: 16, emeralds: 6, bonus: BREAD, bonus-count: 6}
    steps:
      - {title: 林海走查, description: 在真实绯红森林中走过不同区域；重复绕同一棵菌树不会增加路线证据。, goal: biome, dimension: nether, biome: 'minecraft:crimson_forest', target: 6, zone-size: 16, min-distance: 128, min-seconds: 30}
      - {title: 带回林海路线, description: 返回主世界保存这次远行履历。, goal: return, dimension: overworld, target: 1}
  warped_forest_trail:
    scope: personal
    repeat: once
    title: 诡异森林的蓝光
    description: 沿蓝绿色菌林勘察不同地带，留意末影人的目光和脚下地形，完成后返回主世界。
    icon: WARPED_FUNGUS
    reward: {fame: 16, emeralds: 6, bonus: BREAD, bonus-count: 6}
    steps:
      - {title: 蓝光林地走查, description: 亲自在诡异森林走出一段有新覆盖的路线，辨清沿途地形。, goal: biome, dimension: nether, biome: 'minecraft:warped_forest', target: 6, zone-size: 16, min-distance: 128, min-seconds: 30}
      - {title: 归来的蓝光见闻, description: 调查完成后返回主世界。, goal: return, dimension: overworld, target: 1}
  end_island_journal:
    scope: personal
    repeat: once
    title: 走向没有黎明的天空
    description: 用末影之眼寻找要塞与末地入口，在末地实际勘察岛屿的不同区域，之后完成返程。
    icon: ENDER_EYE
    reward: {fame: 30, emeralds: 10, bonus: ENDER_PEARL, bonus-count: 4}
    steps:
      - {title: 虚空岛屿踏查, description: 走查末地岛屿的不同地带，提前规划龙、虚空与返程风险；仅落在出生平台不算探索。, goal: dimension, dimension: end, target: 10, zone-size: 16, min-distance: 256, min-seconds: 90, min-biomes: 1}
      - {title: 从无昼之地归来, description: 完成探索后返回主世界；不要求独自击败末影龙。, goal: return, dimension: overworld, target: 1}
  end_city_letter:
    scope: personal
    repeat: once
    title: 紫影高塔的来信
    description: 前往末地外岛，探索末地城的塔楼与连廊，带回实际路线；不把远望高塔当作完成。
    icon: PURPUR_BLOCK
    reward: {fame: 36, emeralds: 12, bonus: GOLDEN_APPLE, bonus-count: 3}
    steps:
      - {title: 紫影高塔内部勘察, description: 进入同一座自然末地城，在不同建筑区段间探索，注意潜影贝的漂浮效果。, goal: structure, dimension: end, structure: 'minecraft:end_city', target: 8, min-distance: 64, min-seconds: 40, min-sections: 3, min-height-span: 8}
      - {title: 带回外岛来信, description: 保留勘察履历，返回主世界。, goal: return, dimension: overworld, target: 1}
  woodland_mansion_survey:
    scope: personal
    repeat: once
    title: 深林宅邸调查书
    description: 借助制图师的林地探险家地图寻找府邸，深入房间与走廊调查多处内部区段，留下探索履历。
    beneficiary: 冒险者公会远行档案
    icon: DARK_OAK_DOOR
    reward: {fame: 32, emeralds: 12, bonus: GOLDEN_APPLE, bonus-count: 2}
    steps:
      - {title: 宅邸深处的路线, description: 深入同一座自然林地府邸的多个房间与走廊区段，走出新路线；注意卫道士和唤魔者。, goal: structure, dimension: overworld, structure: 'minecraft:mansion', target: 16, min-distance: 128, min-seconds: 90, min-sections: 6, min-height-span: 5}
  stronghold_star_gate:
    scope: personal
    repeat: once
    title: 地下群书与星门
    description: 跟随末影之眼找到要塞，探索交错回廊与房间，辨清地下通路；本委托不要求开启末地门。
    icon: CHISELED_STONE_BRICKS
    reward: {fame: 24, emeralds: 8, bonus: ENDER_PEARL, bonus-count: 2}
    steps:
      - {title: 要塞回廊测绘, description: 进入同一座自然要塞，在不同内部区段走查，寻找房间与分叉，不能只站在地面坐标上。, goal: structure, dimension: overworld, structure: 'minecraft:stronghold', target: 10, min-distance: 96, min-seconds: 60, min-sections: 4}
  ocean_monument_lights:
    scope: personal
    repeat: once
    title: 海底长明灯
    description: 借海洋探险家地图寻找海底神殿，准备水下呼吸手段，调查神殿内部路线与多个区段。
    icon: SEA_LANTERN
    reward: {fame: 32, emeralds: 12, bonus: GOLDEN_APPLE, bonus-count: 2}
    steps:
      - {title: 沉入长明灯的回廊, description: 实际游入自然海底神殿并走查内部多处区段；水面上方经过不计，注意守卫者。, goal: structure, dimension: overworld, structure: 'minecraft:monument', target: 10, min-distance: 80, min-seconds: 60, min-sections: 1}
  ancient_city_silence:
    scope: personal
    repeat: once
    title: 古城沉默的回声
    description: 深入幽匿之下的远古城市，勘察遗迹不同区段与撤离路线；谨慎潜行，不要求召出或击杀监守者。
    icon: SCULK_SENSOR
    reward: {fame: 32, emeralds: 12, bonus: GOLDEN_APPLE, bonus-count: 2}
    steps:
      - {title: 无声古城调查, description: 在同一座自然远古城市的内部区段踏查不同地带；记住退路，避免无谓触发尖啸。, goal: structure, dimension: overworld, structure: 'minecraft:ancient_city', target: 12, min-distance: 128, min-seconds: 75, min-sections: 4}
  desert_pyramid_archive:
    scope: personal
    repeat: once
    title: 黄沙下的旧纹章
    description: 调查沙漠神殿地上与地下的不同位置，辨认古老布局和陷阱；仅看到屋顶不能交差。
    icon: CHISELED_SANDSTONE
    reward: {fame: 14, emeralds: 5, bonus: BREAD, bonus-count: 4}
    steps:
      - {title: 黄沙神殿走查, description: 进入自然沙漠神殿，探索不同位置与高度；小心地下压力板，不要求引爆或搜刮。, goal: structure, dimension: overworld, structure: 'minecraft:desert_pyramid', target: 4, min-distance: 24, min-seconds: 15, min-sections: 1, min-height-span: 6}
  jungle_temple_puzzle:
    scope: personal
