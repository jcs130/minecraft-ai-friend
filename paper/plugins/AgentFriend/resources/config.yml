arena-built: false
last-run: 0
# Set both entrance role IDs to their surveyed original Villager UUIDs to opt in. Restart to bind.
trial-platform-residents: {}
legacy-task-npcs:
  # At startup, retire only AgentFriend's own tagged RPG storyline and life-guild task bodies.
  # Story notes remain available at their original locations. Life contracts stay on the board.
  story: false
  life-guild: false
waypoints:
  max-per-player: 32
guild-storage:
  # Exact Floodgate UUID of Mengmeng (.MicroKQ). OP does not bypass property ownership.
  owner-uuid: '00000000-0000-0000-0009-00000d9f9c7b'
nametags:
  # Only real Agent player accounts receive the short overhead role prefix.
  # Camera and Goddess spectator accounts are intentionally absent.
  agent-prefix: '[Agent] '
  # Registered Agent/Eye pairs are re-read while Paper stays online.
  eye-pairs-file: E:/MC/ops/agent-eye-pairs.json
  agent-uuids:
  - ccba3629-1f58-33d2-bd0c-f7ba6e699816 # CortiLan
  - 08a6a7ce-526a-3e3f-b0d3-7509efce8398 # Kirito
  - 66f280bd-71f9-37a7-b0a4-f352a8c624c5 # Naruto
  - 9ad939f0-c56e-3b7b-ba68-e359b67af0c5 # corti
dungeon-enemy-moves:
  enabled: false
dungeon-encounters:
  # Opt in after validating this map's layout. Requires dungeon-enemy-moves.enabled.
  void-citadel: false
crypt-temporary:
  # Set the world UUID, reserved boxes and materials after surveying the crypt interior.
  enabled: false
coach:
  adventure-enabled: true
  adventure-first-seconds: 1200
  adventure-interval-seconds: 3600
  enabled: true
  default-java: true
  default-bedrock: false
  death-threshold: 3
  death-window-seconds: 1800
  idle-seconds: 900
  unused-seconds: 2700
  cooldown-seconds: 1800
