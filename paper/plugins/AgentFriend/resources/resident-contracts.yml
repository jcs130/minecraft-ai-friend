# Resident activities share the existing guild slot, frozen contract, ability record and reward queue.
# Reload together with task-market.yml: mycli admin market reload.
# Stable IDs are permanent; change wording/rewards for future accepts, never rewrite an active run.
schema-version: 1
tasks:
  field_cycle:
    scope: personal
    repeat: daily
    title: 青禾的麦田约定
    description: 从自家或获准的田里收割八株成熟小麦，原地补种，再把余粮卖给禾仓。丰收时节更适合下田。
    beneficiary: 田野学者·青禾
    icon: WHEAT
    reward: {fame: 4, emeralds: 2, bonus: BREAD, bonus-count: 2}
    steps:
      - {title: 收割成熟小麦, description: 亲手收割八个不同位置的成熟小麦；未熟、受保护、创作模式都不算。先交本阶段再补种。, goal: harvest, crop: WHEAT, target: 8}
      - {title: 给田地留明天, description: 在刚才亲手收割的八格原地种下小麦种子；别处种植或反复拔插同一格不算。, goal: replant, crop: WHEAT, target: 8}
      - {title: 把余粮带到集市, description: 到 world(-547,67,-445)向禾仓完成一次农产品出售；需真实支付物品，打开窗口不算。, goal: trade, shop: 4e2dc6c5-9128-4d0a-9c20-3caee63324d2, target: 1}
  vegetable_cycle:
    scope: personal
    repeat: daily
    title: 菜园里的十个明天
    description: 青禾想留住村庄菜园的生机：收成熟胡萝卜、原地补种、把胡萝卜交给公会厨房。
    beneficiary: 田野学者·青禾
    icon: CARROT
    reward: {fame: 4, emeralds: 2, bonus: BREAD, bonus-count: 2}
    steps:
      - {title: 十株成熟胡萝卜, description: 亲手收割十个不同位置的成熟胡萝卜；先交这一阶段再补种。, goal: harvest, crop: CARROTS, target: 10}
      - {title: 原地补种, description: 在本次亲手收割的十格种回胡萝卜；每格只计一次。, goal: replant, crop: CARROTS, target: 10}
      - {title: 菜园与厨房, description: 交付十根胡萝卜到公共补给库存；补种后留下的收成给厨房使用。, goal: donate, item: CARROT, target: 10, chest: supplies}
  village_breakfast:
    scope: personal
    repeat: daily
    title: 村庄的鱼汤早饭
    description: 青禾为忙碌的旅人备早饭。亲自钓鱼，再交出三条生鳕鱼作为公共食材。
    beneficiary: 青禾与公会厨房
    icon: COD
    reward: {fame: 4, emeralds: 2, bonus: BREAD, bonus-count: 3}
    steps:
      - {title: 水边的耐心, description: 亲自钓起三条鱼；普通实际钓获才算，捡鱼不算。, goal: fish, target: 3}
      - {title: 今日鱼汤, description: 向公共补给箱交付三条生鳕鱼；在公会交付入口统一扣物并入公共库存。, goal: donate, item: COD, target: 3, chest: supplies}
  trail_supply:
    scope: personal
    repeat: daily
    title: 给后来者留一份口粮
    description: 在补给商购买物资，再交四块面包到公共补给箱，让下一位出发的旅人有东西吃。
    beneficiary: 旅人阿岚与后来者
    icon: BREAD
    reward: {fame: 3, emeralds: 1, bonus: ARROW, bonus-count: 8}
    steps:
      - {title: 集市的真实交易, description: 到村庄补给商 world(-547,67,-442)完成一次购买；真实扣款与交货后才算。, goal: trade, shop: 0ca8e5d5-7ec0-48d6-94fc-5ec19c72e044, target: 1}
      - {title: 留下四块面包, description: 交付四块面包到公共补给库存；别拿萌萌的私产凑单。, goal: donate, item: BREAD, target: 4, chest: supplies}
  first_spell:
    scope: personal
    repeat: once
    title: 小满的第一堂实操
    description: 导师小满要看一次真正的技能施放，再请你认认村庄集市。基础与职业技能都能练习。
    beneficiary: 旅途导师·小满
    icon: ENCHANTED_BOOK
    reward: {fame: 6, emeralds: 2, bonus: MAP, bonus-count: 1}
    steps:
      - {title: 法术真正生效, description: 接单后成功使用一次本人已学技能；正常耗费资源与冷却，失败、查询、聊天声明不算。, goal: skill_cast, target: 1}
      - {title: 认识补给商, description: 到 world(-547,67,-442)补给商完成一次真实交易。下一步可以接阿卷的照片委托。, goal: trade, shop: 0ca8e5d5-7ec0-48d6-94fc-5ec19c72e044, target: 1}
  photo_album:
    scope: personal
    repeat: once
    title: 阿卷的第一张生活照
    description: 为自己的家或领地做一张照片展品。用现有截图上传，成图后亲手挂上展示框；照片与展品由本人保留。
    beneficiary: 村庄说书人·阿卷
    icon: ITEM_FRAME
    reward: {fame: 6, emeralds: 2, bonus: PAPER, bonus-count: 4}
    steps:
      - {title: 新建本人照片, description: 接单后用 /imageframe create <名字> upload 1 1 上传现有截图，等服务器真正创建成图。旧图、复制图、只有HTTP成功都不算。, goal: photo, target: 1}
      - {title: 把这一刻挂起来, description: 在本人或获准位置把本次新建的照片亲手放进空展示框；原版地图或别人的照片不算。, goal: photo_hang, target: 1}
  crypt_report:
    scope: personal
    repeat: daily
    title: 阿岚的亡骸地窖调查
    description: 自选普通、冒险或末日进入亡骸地窖，参与所有房间并返程结算，再交调查纸张。冒险以上会遇到遗迹精英。
    beneficiary: 旅人阿岚
    icon: BONE
    reward: {fame: 10, emeralds: 3, bonus: TORCH, bonus-count: 8}
    steps:
      - {title: 全程调查并平安归来, description: 接单后 dungeon start undead_crypt，自行清完所有房间并返第一间，dungeon claim undead_crypt真正结算。旧结算不算。, goal: site_clear, site: undead_crypt, target: 1}
      - {title: 交回调查纸张, description: 向公共杂项库存交两张纸，作为旅人调查材料。地图和照片不要交出。, goal: donate, item: PAPER, target: 2, chest: misc}
  creeping_report:
    scope: personal
    repeat: once
    title: 蔓生地窖与归来的照片
    description: 深入蔓生地窖并全程返程结算，归来后制作一张生活照片挂在获准位置，留下自己的旅途记忆。
    beneficiary: 阿岚与阿卷
    icon: VINE
    reward: {fame: 15, emeralds: 5, bonus: COMPASS, bonus-count: 1}
    steps:
      - {title: 蔓生地窖全程返程, description: 接单后清完 creeping_crypt 全部房间、返第一间并 dungeon claim creeping_crypt；亲自参与，难度自选。, goal: site_clear, site: creeping_crypt, target: 1}
      - {title: 归来后的新照片, description: 本阶段再创建一张本人照片地图，截图上传流程 /photohelp；不要求照片画面自动识别遗迹。, goal: photo, target: 1}
      - {title: 本人旅途小展, description: 把本次新建照片亲手挂入自己或获准的空展示框，展品保留。, goal: photo_hang, target: 1}
  bunker_report:
    scope: personal
    repeat: once
    title: 战团地堡的归来课
    description: 完整调查战团地堡并返程结算，再成功使用一次技能。把战斗和日常所学连起来。
    beneficiary: 阿岚与导师小满
    icon: SHIELD
    reward: {fame: 15, emeralds: 5, bonus: GOLDEN_APPLE, bonus-count: 1}
    steps:
      - {title: 地堡全程调查, description: 接单后参与 bunker 全部房间、返第一间并 dungeon claim bunker；普通难度也可完成。, goal: site_clear, site: bunker, target: 1}
      - {title: 生效的一次技艺, description: 在本阶段成功使用本人已学技能；资源与冷却照常，不必使用攻击技能。, goal: skill_cast, target: 1}
