# Existing Dungeons and Taverns 3.2 buildings in this world's seed; no generated replacement.
# Inspect actual room floors before adding locations. Enemies spawn only on loaded, clear ground.
# mythic entries apply only to adventure/apocalypse; normal uses the same native mobs and health.
