schema-version: 1
# Effects are bounded native server primitives. Learning uses skill points; each cast additionally uses AuraSkills mana.
skills:
  tank_taunt:
    title: 守卫·挑衅
    profession: tank
    icon: SHIELD
    effect: tank_taunt
    equipment: shield
    mana: 4
    cooldown-seconds: 12
    limits: {range: 6, targets: 2, power: 1, duration-seconds: 3}
    description: "持盾吸引6格内可见敌人；1/2/3级最多2/3/4名，持续3/4/5秒。离开12格、收盾或倒地即解除。仅对敌对生物生效，不抢别队副本怪。"
    origin: "千灯纪坦克战术；借鉴攻略组前卫职责，数值为Minecraft适配，不冒称原作公式。"
  tank_bastion:
    title: 守卫·坚壁
    profession: tank
    icon: IRON_CHESTPLATE
    effect: tank_bastion
    equipment: shield
    mana: 5
    cooldown-seconds: 18
    limits: {range: 1, targets: 1, power: 3, duration-seconds: 4}
    description: "持盾迎敌，正面怪物攻击的最终伤害减少50%；1/2/3级每击最多减3/4/6点，持续4/5/6秒。背面攻击不减；不与护阵重复相乘。"
    origin: "千灯纪坦克防御技；盾牌原版格挡仍有效，未受伤不会制造治疗贡献。"
  tank_bash:
    title: 守卫·盾击
    profession: tank
    icon: IRON_AXE
    effect: sword_thrust
    equipment: shield
    mana: 3
    cooldown-seconds: 6
    limits: {range: 2.5, targets: 1, power: 3, duration-seconds: 1}
    description: "持盾打击正前方2.5格内的一名可见敌人，1/2/3级造成3/4/5点基础伤害；提供坦克单人练级的攻击手段。"
    origin: "千灯纪盾战适配；不击穿墙壁，不伤玩家、村民或动物。"
  tank_cover:
    title: 守卫·掩护
    profession: tank
    icon: IRON_HELMET
    effect: ward
    equipment: shield
    mana: 6
    cooldown-seconds: 20
    limits: {range: 4, targets: 2, power: 3, duration-seconds: 4}
    description: "持盾为4格内1/2/3级最多2/3/4名队友掩护4/5/6秒，每人抵挡一次怪物攻击，减伤50%，每击最多3/4/6点。"
    origin: "千灯纪坦克支援技；多人副本用于保护正在施术或救援的队友。"
  warrior_sky_leap:
    title: 凌空跃击
    profession: warrior
    icon: RABBIT_FOOT
    effect: sky_leap
    equipment: none
    mana: 6
    cooldown-seconds: 20
    limits: {range: 1, targets: 1, power: 8, duration-seconds: 20}
    description: "站稳地面、确认头顶开阔后施放；自动起跳，再自行按方向键或摇杆横移并安全落地。一/二/三级目标跃高约8/12/16格，魔力6/8/10，缓降20秒；不会自动攻击或穿过屋顶。"
    origin: "选择战士可花2点学习；二/三级分别需高跃基础/进阶证书，再花3/5点升级。 罗盘学习页：左键学习/升级，右键说明；职业技能页：左键准备/取消，右键施放。"
  mage_soar:
    title: 御空术
    profession: mage
    icon: FEATHER
    effect: soar
    equipment: none
    mana: 8
    cooldown-seconds: 90
    limits: {range: 1, targets: 1, power: 1, duration-seconds: 20}
    description: "施放即进入飞行；用方向键/摇杆前后左右移动，跳跃上升、潜行下降，提前找落点。一/二/三级持续20/30/40秒，魔力8/10/12，到期缓降；不可叠加基础飞行，传送/洗点/离线清理权限。"
    origin: "选择法师可花3点学习；二/三级分别需飞行基础/进阶证书，再花4/6点升级。 罗盘学习页：左键学习/升级，右键说明；职业技能页：左键准备/取消，右键施放。"
  priest_blessing:
    title: 同行祝福
    profession: priest
    icon: GLOW_BERRIES
    effect: blessing
    equipment: none
    mana: 8
    cooldown-seconds: 30
    limits: {range: 8, targets: 2, power: 1, duration-seconds: 8}
    description: "队友靠近8格内再施放，无需点名；对可见生存友军含本人加迅捷I和抗性I。一/二/三级最多2/3/4人、持续8/12/16秒，魔力8/10/12；三级另加力量I，不覆盖更强效果。"
    origin: "选择牧师可花3点学习；二/三级分别需支援基础/进阶证书，再花4/6点升级。 罗盘学习页：左键学习/升级，右键说明；职业技能页：左键准备/取消，右键施放。"
  sword_thrust:
    title: 突刺
    profession: warrior
    icon: IRON_SWORD
    effect: sword_thrust
    equipment: sword
    mana: 4
    cooldown-seconds: 8
    limits: {range: 3, targets: 1, power: 8, duration-seconds: 1}
    description: "持剑突刺3格内一名可见敌人；一/二/三级基础伤害4.0/6.0/8点，魔力4/5/6；不破坏方块。"
    origin: "选择战士解锁学习资格；随后完成剑路初试解锁弧光斩。 罗盘学习页：左键学习/升级，右键说明；职业技能页：左键准备/取消，右键施放。"
  sword_parry:
    title: 架势格挡
    profession: warrior
    icon: SHIELD
    effect: sword_parry
    equipment: sword
    mana: 4
    cooldown-seconds: 12
    limits: {range: 3, targets: 1, power: 6, duration-seconds: 2}
    description: "主手持剑，先正对怪物再施放；随后2秒内可化解一次正面怪物近战，最多减半伤害。冷却12秒；一/二/三级减免上限2/4/6点，魔力4/5/6，施放成功即收费。普通举盾、箭和药水不计格挡试炼。"
    origin: "选择战士仅解锁资格；一级需2技能点学习，准备后施放，实际减伤才计入任务。 罗盘学习页：左键学习/升级，右键说明；职业技能页：左键准备/取消，右键施放。"
  sword_arc:
    title: 弧光斩
    profession: warrior
    icon: DIAMOND_SWORD
    effect: sword_cone
    equipment: sword
    mana: 7
    cooldown-seconds: 12
    limits: {range: 3, targets: 3, power: 4, duration-seconds: 1}
    description: "挥斩正面3格扇形内可见敌人；一/二/三级最多1/2/3名，每名基础伤害2.0/3.0/4点，魔力7/8/9；不破坏方块。"
    origin: "完成任务 tm_sword_arc_trial，验收持剑近战击杀和有效格挡。 罗盘学习页：左键学习/升级，右键说明；职业技能页：左键准备/取消，右键施放。"
  sword_step:
    title: 步法斩
    profession: warrior
    icon: RABBIT_FOOT
    effect: sword_step
    equipment: sword
    mana: 6
    cooldown-seconds: 15
    limits: {range: 3, targets: 1, power: 5, duration-seconds: 1}
    description: "沿安全路径前进3格后挥斩一名敌人；一/二/三级基础伤害3/4/6点，魔力6/7/8；墙、岩浆、悬空和禁止进入处拒绝。"
    origin: "学会弧光斩后完成任务 tm_sword_road_trial。 罗盘学习页：左键学习/升级，右键说明；职业技能页：左键准备/取消，右键施放。"
  sword_beam:
    title: 剑气
    profession: warrior
    icon: AMETHYST_SHARD
    effect: sword_beam
    equipment: sword
    mana: 8
    cooldown-seconds: 16
    limits: {range: 10, targets: 1, power: 6, duration-seconds: 1}
    description: "向准星方向释放10格内单目标剑气；一/二/三级基础伤害3.0/4.5/6点，魔力8/9/10；目标须可见，墙体阻挡。"
    origin: "完成任务 tm_sword_road_trial，与步法斩一并获得。 罗盘学习页：左键学习/升级，右键说明；职业技能页：左键准备/取消，右键施放。"
  twin_legacy:
    title: 双剑觉醒·星流连斩
    profession: warrior
    icon: NETHERITE_SWORD
    effect: sword_combo
    equipment: two_swords
    legacy: true
    world-limit: 0
    mana: 14
    cooldown-seconds: 90
    limits: {range: 3, targets: 1, power: 16, duration-seconds: 2}
    description: "主副手各持剑，对同一敌人进行四段连斩；一/二/三级总基础伤害上限8.0/12.0/16点，魔力14/15/16；每段重查装备、视线、距离和资格。"
    origin: "完成传承任务 tm_twin_legacy_trial，需格挡、组队深层和两处首领层履历。 罗盘学习页：左键学习/升级，右键说明；职业技能页：左键准备/取消，右键施放。"
  guardian_ward:
    title: 守护阵
    profession: warrior
    icon: SHIELD
    effect: ward
    equipment: shield
    mana: 7
    cooldown-seconds: 20
    limits: {range: 5, targets: 4, power: 4, duration-seconds: 6}
    description: "持盾为5格内生存玩家准备护阵；一/二/三级最多2/3/4人，持续4/6/8秒，各抵挡一次怪物攻击并减半伤害，上限2/4/6点，魔力7/8/9。"
    origin: "实际参与原版袭击并获胜后，与村庄誓约一同获得。 罗盘学习页：左键学习/升级，右键说明；职业技能页：左键准备/取消，右键施放。"
  guardian_oath:
    title: 传承·村庄誓约
    profession: warrior
    icon: BELL
    effect: ward
    equipment: shield
    legacy: true
    world-limit: 0
    mana: 12
    cooldown-seconds: 90
    limits: {range: 8, targets: 4, power: 6, duration-seconds: 8}
    description: "持盾为8格内生存玩家准备誓约护阵；一/二/三级最多2/3/4人，持续4/6/8秒，各抵挡一次怪物攻击并减半伤害，上限2/4/6点，魔力12/13/14。"
    origin: "参与原版袭击并获胜，实际造成十点伤害、为队友治疗八点怪物伤量或减免四点伤害之一。 罗盘学习页：左键学习/升级，右键说明；职业技能页：左键准备/取消，右键施放。"
  scout_mark:
    title: 秘法标记
    profession: mage
    icon: ENDER_EYE
    effect: mark
    equipment: none
    mana: 3
    cooldown-seconds: 10
    limits: {range: 12, targets: 1, power: 1, duration-seconds: 8}
    description: "标记前方12格内一名可见敌人；一/二/三级持续8/12/16秒，魔力3/4/5；给出绝对坐标和私有原版粒子。"
    origin: "选择法师解锁学习资格；本人或近旁队友击败仍有效的标记者才计入法师试炼。 罗盘学习页：左键学习/升级，右键说明；职业技能页：左键准备/取消，右键施放。"
  scout_watch:
    title: 秘法巡望
    profession: mage
    icon: SPYGLASS
    effect: mark
    equipment: none
    mana: 6
    cooldown-seconds: 20
    limits: {range: 12, targets: 3, power: 1, duration-seconds: 12}
    description: "标记前方12格内可见敌人；一/二/三级最多1/2/3名，持续8/12/16秒，魔力6/7/8；私有粒子供本人及实际附身的Eye查看。"
    origin: "完成任务 tm_mage_trial，包含标记后的击杀、下界实地调查和返程。 罗盘学习页：左键学习/升级，右键说明；职业技能页：左键准备/取消，右键施放。"
  healer_mend:
    title: 抚愈
    profession: priest
    icon: GLISTERING_MELON_SLICE
    effect: mend
    equipment: none
    mana: 4
    cooldown-seconds: 8
    limits: {range: 8, targets: 1, power: 6, duration-seconds: 1}
    description: "治疗8格内受伤生存玩家；一/二/三级最多1/2/3人，每人最多恢复6/8/10HP，魔力4/6/8；指定玩家名时只治疗该人，旁观者无效。"
    origin: "选择牧师解锁学习资格；只有为其他玩家恢复真实怪物伤量才计入治疗试炼。 罗盘学习页：左键学习/升级，右键说明；职业技能页：左键准备/取消，右键施放。"
  healer_cleanse:
    title: 净化
    profession: priest
    icon: HONEY_BOTTLE
    effect: cleanse
    equipment: none
    mana: 4
    cooldown-seconds: 16
    limits: {range: 1, targets: 1, power: 1, duration-seconds: 1}
    description: "一级技能：解除自身中毒与凋零；消耗4魔力，冷却16秒；没有这些状态时不扣费，不进入冷却。"
    origin: "选择牧师解锁学习资格。 罗盘学习页：左键学习/升级，右键说明；职业技能页：左键准备/取消，右键施放。"
  healer_beacon:
    title: 高阶圣愈术
    profession: priest
    icon: BEACON
    effect: mend
    equipment: none
    mana: 10
    cooldown-seconds: 24
    limits: {range: 8, targets: 4, power: 8, duration-seconds: 1}
    description: "8格群疗：一/二/三级最多2/3/4人，各恢复至多8/10/12HP，魔力10/14/18。二/三级附4/6秒一次怪物攻击减伤50%，上限4/6HP；三级另有1.5秒怪物攻击护佑。保护仅给予本次实际回血者，不免环境、虚空或PvP伤害。"
    origin: "完成任务 tm_healer_trial，需实际队友怪物伤量二十四点和组队试炼第三层。 罗盘学习页：左键学习/升级，右键说明；职业技能页：左键准备/取消，右键施放。"
  mage_bolt:
    title: 奥术飞矢
    profession: mage
    icon: AMETHYST_SHARD
    effect: arcane_bolt
    equipment: none
    mana: 6
    cooldown-seconds: 5
    limits: {range: 12, targets: 1, power: 6, duration-seconds: 1}
    description: "攻击准星前方12格内一名可见敌人；一/二/三级基础伤害3.0/4.5/6点，魔力6/7/8；墙体阻挡，不破坏方块。"
    origin: "选择法师解锁学习资格；可直接施法、绑定原法杖或刻印原版工具。 罗盘学习页：左键学习/升级，右键说明；职业技能页：左键准备/取消，右键施放。"
  mage_frost:
    title: 霜寒束缚
    profession: mage
    icon: PACKED_ICE
    effect: frost_cone
    equipment: none
    mana: 8
    cooldown-seconds: 14
    limits: {range: 5, targets: 3, power: 3, duration-seconds: 3}
    description: "攻击正面5格扇形内可见敌人；一/二/三级最多1/2/3名，每名基础伤害1.5/2.5/3点并附1/2/3秒缓慢一，魔力8/9/10；不伤玩家或村民。"
    origin: "选择法师解锁学习资格；为战士接敌或牧师救援争取时间。 罗盘学习页：左键学习/升级，右键说明；职业技能页：左键准备/取消，右键施放。"
  mage_flame:
    title: 炎流
    profession: mage
    icon: BLAZE_POWDER
    effect: flame_cone
    equipment: none
    mana: 9
    cooldown-seconds: 18
    limits: {range: 4, targets: 3, power: 4, duration-seconds: 1}
    description: "攻击正面4格扇形内可见敌人；一/二/三级最多1/2/3名，每名基础伤害2.0/3.0/4点，魔力9/10/11；不点燃实体或建筑。"
    origin: "完成任务 tm_mage_trial，实际协战、调查下界并返回。 罗盘学习页：左键学习/升级，右键说明；职业技能页：左键准备/取消，右键施放。"
