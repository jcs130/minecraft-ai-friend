# Cosmetic chat and addressed NPC captions. Reload: mycli admin bubbles reload (console only).
schema-version: 1
enabled: true
view-distance: 24
duration-seconds: 8
max-active: 32
max-pending: 64
max-characters: 120
line-columns: 36
max-lines: 3
update-ticks: 5
replace-cooldown-ms: 650
require-line-of-sight: true
npc-enabled: true
# NPCSpeak stable IDs; two reserved IDs enable the built-in receptionist and seven life mentors.
npc-speakers: [storyteller, botanist, guild-receptionist, life-mentors]
# 半透明白底与高对比文字；旧配置缺少这些字段时也使用此默认配色。
# 只接受带引号的 #RRGGBB，热重载可调整，聊天格式码不会覆盖这里的颜色。
background-color: '#ffffff'
# 0=完全透明，255=完全不透明；只调整背景，正文始终清晰不透明。
background-opacity: 180
player-text-color: '#1f2937'
npc-text-color: '#1d4ed8'
pointer-color: '#64748b'
