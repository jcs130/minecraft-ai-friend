schema-version: 1
welcome-revision: 17
enabled: true
agents-only: false
poll-seconds: 60
welcome-delay-seconds: 2
welcome-cooldown-seconds: 21600
session-grace-seconds: 60
reminder-seconds: 600
progress-delay-seconds: 20
min-gap-seconds: 60
combat-quiet-seconds: 30
complete-reminder-seconds: 3600
pause-seconds: 1800
welcome:
- 千灯纪：破晓攻略MMORPG。先 /mycli intro；职业、技能、任务、副本按步骤查询，旧版职业与技能已归档。
steps:
  register:
    title: 先登记为冒险者
    message: 旅人营地的石质地坪、地基和地标受保护。采集、建造请到 X=-1146..-1078、Z=-638..-567 范围外，先用 /mycli protect 查询。引路人阿晴(-1099,65,-601)，主城东偏南约600格(-543,67,-439)。/mycli guild join 免费登记，不自动接任务。
  guide_start:
    title: 报名小满的新手实习
    message: 用 /mycli world guide start 自愿报名。三项证明是报名后读技能目录、成功施法、完整交付任选路线委托；战斗、制造、探索、后勤、工程、生活都可以，不必先种田。
  catalog:
    title: 看看自己能学什么
    message: 先 /mycli profession list 选择职业，再 skills list / skills info <ID> 查本人技能。职业初始主动技可直接cast；prepare设置点击技能，learn仅按详情花点学节点，通用能力无需重学。
  cast:
    title: 亲手成功施放一次技能
    message: 先 /mycli profession list 选择职业，再 skills list / skills info <ID> 查本人技能。职业初始主动技可直接cast；prepare设置点击技能，learn仅按详情花点学节点，通用能力无需重学。
  life_accept:
    title: 开启新的冒险
    message: 先 /mycli tasks list 选讨伐、巡访、打造或攻略；tasks info <ID> 查条件，tasks accept <ID> 主动接取。原公会在途探索单用 /mycli guild status 继续，不必放弃或种田。
  route_choose:
    title: 选择自己的委托路线
    message: 先 profession list 选六职业，再 skills list 看初始技；tasks list 选讨伐或探索，整备后攻略副本。完整流程 /mycli intro。
  life_progress:
    title: 继续当前生活委托
    message: 按自己已接的任务真实行动；只计算合规的原版操作。保护拒绝时停止，换获准位置；别为了提醒放弃在途任务。
  life_claim:
    title: 生活委托已达标，记得交付
    message: 用 /mycli life claim 结算当前委托。奖励进入个人奖励箱或待入箱队列，空间不足不等于奖励丢失。
  guild_accept:
    title: 接取第一张冒险委托
    message: 先 /mycli tasks list 选讨伐、巡访、打造或攻略；tasks info <ID> 查条件，tasks accept <ID> 主动接取。原公会在途探索单用 /mycli guild status 继续，不必放弃或种田。
  guild_progress:
    title: 完成当前冒险委托并交付
    message: 用 /mycli guild status 复查真实步骤；每阶段达标后 guild claim，全部完成才发最终奖。不根据聊天自报或到达一次就判探索完成。
  complete:
    title: 攻略路线已开启
    message: 先 /mycli profession list 选择职业，再 skills list / skills info <ID> 查本人技能。职业初始主动技可直接cast；prepare设置点击技能，learn仅按详情花点学节点，通用能力无需重学。
release-revision: 6
release-notice:
- '[副本更新] 建筑不可拆改。组队先 /mycli guild party --help；邀请被接受后，全员穿好装备到首室，由队长start。用 /mycli dungeon status 核对本人参战。'
- '[生存规则] 本场2人以上时先倒地，队友4格内停留10秒或清室复活，全队倒下才撤离。死亡背包装备保留，先核对回执，不必盲目找掉落。查询：/mycli status'
