schema-version: 1
welcome-revision: 14
enabled: true
agents-only: false
poll-seconds: 60
welcome-delay-seconds: 2
welcome-cooldown-seconds: 21600
session-grace-seconds: 60
reminder-seconds: 600
progress-delay-seconds: 20
min-gap-seconds: 60
combat-quiet-seconds: 30
complete-reminder-seconds: 3600
pause-seconds: 1800
welcome:
  - 欢迎来到千灯纪！城西营地地坪、地基和地标受保护，采集建造请到石质边线外。右键引路人·阿晴（-1099,65,-601）或技能罗盘看旅途指南；/mycli intro、rules、status 入门，progress 分别看主线、实练和委托。
  - /mycli rules 所有已登录普通玩家可读；/mycli capabilities info <ID> 查参数、权限、消耗和最终结果查询。查询不报名、不接单；coach lessons 只读，coach enroll 主动报名特色实练。
  - 你有54格大背包：右键黄色大背包或 /minepacks:backpack open。存入后关闭重开核对；不是/questbag任务袋，也不是540格个人奖励箱。超时或断线先查询，不自动重放存取、交易、施法或领奖。
  - 本服中文交流，系统回执只属于本人。主村庄 X=-634..-458、Z=-530..-365 可少量整地，地下禁止深挖。村西矿坑(-652,68,-484)：沿台阶下到Y36，向西X≤-702采矿；入口有公共箱、工作台和炉子。技能/出行耗魔力，拍照用罗盘相机，无需上传。coach later 暂停提醒、off 关闭。
steps:
  register:
    title: 先登记为冒险者
    message: 旅人营地的石质地坪、地基和地标受保护。采集、建造请到 X=-1146..-1078、Z=-638..-567 范围外，先用 /mycli protect 查询。引路人阿晴(-1099,65,-601)，主城东偏南约600格(-543,67,-439)。/mycli guild join 免费登记，不自动接任务。
  guide_start:
    title: 报名小满的新手实习
    message: 用 /mycli world guide start 自愿报名。三项证明是报名后读技能目录、成功施法、完整交付任选路线委托；战斗、制造、探索、后勤、工程、生活都可以，不必先种田。
  catalog:
    title: 看看自己能学什么
    message: 用 /mycli skills list common 读取基础技能；按 MC_SPELL_NEXT 继续翻页。skills info <ID> 查条件，skills points 查点数；查询免费，不会代学。
  cast:
    title: 亲手成功施放一次技能
    message: 先看本人魔力、学习资格和冷却，再选一个适合当前场景的技能；失败不会完成实习。
  life_accept:
    title: 自选生活实践
    message: life board 查看旧生活委托，完成后 life claim 交付也可计实习。生活只是任选路线之一，也可 tasks list 选择战斗、制造、探索或后勤。
  route_choose:
    title: 选择自己的委托路线
    message: 用 /mycli tasks list 查看六条路线，再 tasks list <路线> 和 tasks info <ID> 查条件；guild accept <ID> 接单。也可用技能罗盘的自选委托路线按钮。
  life_progress:
    title: 继续当前生活委托
    message: 按自己已接的任务真实行动；只计算合规的原版操作。保护拒绝时停止，换获准位置；别为了提醒放弃在途任务。
  life_claim:
    title: 生活委托已达标，记得交付
    message: 用 /mycli life claim 结算当前委托。奖励进入个人奖励箱或待入箱队列，空间不足不等于奖励丢失。
  guild_accept:
    title: 接取第一张冒险委托
    message: tasks list 按兴趣选战斗、制造、探索、后勤、工程或生活，先看条件再接单；与居民事务共用公会任务槽。任选一项完整交付即可计实习，不必补做种田。
  guild_progress:
    title: 完成当前冒险委托并交付
    message: 用 /mycli guild status 复查真实步骤；每阶段达标后 guild claim，全部完成才发最终奖。不根据聊天自报或到达一次就判探索完成。
  complete:
    title: 入门已完成，选择自己的生活
    message: 先选近郊探索，再尝试普通试炼塔和遗迹地下城：tasks list exploration、arena status、dungeon list。农事日常可选，毕业不需反复种田；出发用 guild shared 取公共补给。已有任务按 tasks status 收尾，试炼和地下城不占公会委托槽。
