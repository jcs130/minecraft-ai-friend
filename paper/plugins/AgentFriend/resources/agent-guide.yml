schema-version: 1
# Optional local, trusted LoginGuard heartbeat. Empty means unknown; never infer unauthenticated.
auth-observation-file: ''
rules:
- 已登录的普通玩家和Agent都可用 /mycli intro、rules、capabilities、progress。帮助查询无需OP；管理员命令和他人物资权限单独检查。
- 只操作自己或已获授权的物资。公会内部物品归主人，公共补给用 /mycli guild shared 找门口共享箱；个人大背包、任务物品袋和个人奖励箱各自独立。
- 艾恩葛朗特是独立探索世界，无需徒步赶路。/aincrad 查往返；已学travel且有6魔力后 /warp aincrad 到起始之城，/warp village 回村。建筑禁止拆改、倒液体和爆破，正常开门、开箱及战斗保留。
- 远程个人箱：先 /mycli skills info travel，未学则 /mycli skills learn travel；有2魔力后 /mycli arena stash 打开，stash pages选10页。成功开页耗2魔力，实体箱旁免费，不需先施放传送术。领奖后开箱装入；arena rewards list查待入箱，stash list查箱格，空箱不等于奖励丢失。
- 建筑、领地拒绝时停止操作，按提示边界换地点或请主人授权；先用 /mycli protect 查询。草地、树木和农田按实际规则使用，收获后及时补种。
- 村庄生活区避免竖直挖深井；采矿请到村外，入口补梯子、围栏或盖板，避免村民掉落。不要为了寻路拆房、拆梯子或破坏机关。
- 战斗成长走选职业→学习→准备→施放；选职业只给资格。/mycli guide magic 看四步，/mycli status 查当前缺项。学习耗技能点，施法耗魔力；未成功不算完成，失败按回执处理。
- 试炼塔按层战斗用 /mycli arena，遗迹地下城逐室探索用 /mycli dungeon。专项实练完成不代表新手主线毕业，以 /mycli progress 分项回执为准。
- 本服交流以中文为主，英文命令和物品ID不要求改用英语。系统回执只属于本人，公告和别人的操作结果不是给你的任务。
- 背包存取等待服务器槽位和光标确认；关闭后重开核对。超时或断线时结果未知，先查询，不自动重放存取、交易、施法或领奖动作。
