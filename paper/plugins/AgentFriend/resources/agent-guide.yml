schema-version: 1
# Optional local, trusted LoginGuard heartbeat. Empty means unknown; never infer unauthenticated.
auth-observation-file: ''
rules:
- 已登录的普通玩家和Agent都可用 /mycli intro、rules、capabilities、progress。帮助查询无需OP；管理员命令和他人物资权限单独检查。
- 只操作自己或已获授权的物资。公会内部物品归主人，公共补给用 /mycli guild shared 找门口共享箱；个人大背包、任务物品袋和个人奖励箱各自独立。
- 艾恩葛朗特是独立世界。/aincrad 查往返，/warp aincrad 到起始之城、/warp village 回村，成功6魔力；不需另学travel。城区可放置但不可挖坏，城外自由拆建仍服从实际领地与副本保护；遗迹建筑不能凿墙。核对世界key和UUID，不把不同世界的相近坐标当作附近。
- 远程个人箱无需学习travel、无需先传送。/mycli arena stash inventory 查本人背包槽0–35，再用 stash putslot <槽> <数量> 远程存箱（成功2魔力）；stash list 查箱格，stash page 1取物，成功远程开页2魔力、实体箱旁免费。54格大背包、个人箱与待入箱奖励分开，空箱不等于奖励丢失；只在真实槽位确认后继续操作。
- 建筑、领地拒绝时停止操作，按提示边界换地点或请主人授权；先用 /mycli protect 查询。草地、树木和农田按实际规则使用，收获后及时补种。
- 村庄生活区避免竖直挖深井；采矿请到村外，入口补梯子、围栏或盖板，避免村民掉落。不要为了寻路拆房、拆梯子或破坏机关。
- RPG统一由Vortex提供六职业、等级、学习点、天赋、魔力和金币。/mycli profession info <ID> 看实际配置；初始主动技选职后可用，learn 按条件花点，prepare只设置点击技能，cast才施放。寒霜、星芒箭、闪现、圣愈、饱食、造物、归乡等基础技无需选职或学习；技能目标、费用、冷却按本人info核对。换职、完整洗点和拍卖交付未开放，不猜命令。
- 试炼塔主世界world按钮(-596,92,-313)。先 /mycli arena status；goto arena成功6魔力。穿齐四甲、带武器，伙伴到按钮12格内，一人arena start开场免费。第1层起、清层自动下楼，不用另找第2层；arena rest续战8魔力。遗迹另查dungeon list；旧公会单guild status，新RPG任务tasks status。
- 本服交流以中文为主，英文命令和物品ID不要求改用英语。系统回执只属于本人，公告和别人的操作结果不是给你的任务。
- 背包存取等待服务器槽位和光标确认；关闭后重开核对。超时或断线时结果未知，先查询，不自动重放存取、交易、施法或领奖动作。
- 更多玩法按需 /mycli world list，每页6项；/mycli world events 查询随机集结。活动自主参加，公告不等于报名，不会自动传送、过关或发奖；集结结束后已开始的挑战可以继续。组队、交易、摄影、NPC、日记、外观和语音均从目录进入，不必预读全部命令。
