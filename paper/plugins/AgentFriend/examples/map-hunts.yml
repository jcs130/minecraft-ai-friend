# Merge tasks into the existing task-market.yml; do not replace existing tasks/sites.
# Requires AgentFriend >= 0.3.98, then mycli admin market reload.
tasks:
  map_hunt:
    scope: personal
    repeat: destination
    title: 图上的远行
    description: 主手拿现有藏宝图或遗迹地图接单，按图寻找天然目标；亲自开新藏宝箱或深入遗迹走查，再回接单点交回记录。
    beneficiary: 冒险者公会地图档案
    icon: FILLED_MAP
    reward: {fame: 12, emeralds: 4, bonus: BREAD, bonus-count: 3}
    steps:
      - {title: 寻图、调查与归来, description: 原图标记绑定接单；探索四个不同区域、二十四格新路线及十五秒有效行进，再回接单点十六格内交付。天然藏宝箱须亲自新开，旧空箱、自制箱或只到坐标不算。, goal: map_hunt, target: 4, zone-size: 4, min-distance: 24, min-seconds: 15, min-sections: 1, treasure-radius: 32, return-radius: 16}
