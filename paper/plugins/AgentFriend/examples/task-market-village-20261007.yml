# Hot operations: mycli admin market reload, then register <siteID> before construction.
# A site requires world, min/max [x,y,z], materials, deck-y; bridge: start/end;
# mechanism: components {MATERIAL: count}, outputs [{at: [x,y,z], material: REDSTONE_LAMP}].
# Bounds/materials of registered sites are immutable. Use new IDs for new work.
schema-version: 1
register-once: ["north_river","north_road","guild_approach","guild_gate_demo","watch_post","drawbridge"]
sites:
  north_river: {"world":"world","min":[-576,63,-564],"max":[-574,67,-547],"deck-y":63,"materials":["OAK_PLANKS","ANDESITE_SLAB","STONE_BRICKS"],"start":[-575,63,-564],"end":[-575,63,-547]}
  north_road: {"world":"world","min":[-583,63,-555],"max":[-581,63,-549],"deck-y":63,"materials":["STONE_BRICKS","COBBLESTONE","ANDESITE","DIRT_PATH"]}
