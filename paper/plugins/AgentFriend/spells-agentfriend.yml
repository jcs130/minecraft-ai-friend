# Vanilla-protocol family spells. Copy to plugins/MagicSpells/spells-agentfriend.yml.
# Distinct, fixed conjure recipes prevent arbitrary item IDs or quantities from chat input.
selfheal:
    spell-class: ".targeted.HealSpell"
    always-granted: true
    name: Sacred Heal
    description: Heal yourself for four hearts.
    spell-icon: golden_apple
    cast-item: stick
    target-self: true
    can-target: players
    heal-amount: 8
    cancel-if-full: true
    cooldown: 15
    cost: [] # Charged from AuraSkills by AgentFriend on successful cast.
    str-cost: 6 shared mana
    str-cast-self: Sacred healing restores your health.
    str-max-health: You are already at full health.
    effects:
        hearts:
            position: target
            effect: particles
            particle-name: heart
            height-offset: 1
            horiz-spread: 0.5
            vert-spread: 0.5
            count: 20

