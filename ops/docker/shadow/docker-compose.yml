# 千灯纪 Phase B — 影子环境编排（不动生产；端口 25899/25880/18088/19090）
# 前置：python build-shadow.py 生成 mods/data/mcdata/copaw/copaw.secret/mc 卷
# 启动：cd ops/docker/shadow && docker compose --env-file shadow.env up -d
# 全景：mc(qwenpaw 家外) + world(女神化身) + panel + qwenpaw(守卫魂) + guard(守卫桥) + npc + oracle
name: shadow

services:
  # ── MC 主服（生产 modpack + god-channel 版 numen_act）──
  mc:
    image: itzg/minecraft-server:java21
    container_name: shadow-mc
    restart: unless-stopped
    environment:
      EULA: "TRUE"
      TYPE: NEOFORGE
      VERSION: "1.21.1"
      NEOFORGE_VERSION: "21.1.248"
      MEMORY: 3G
      SERVER_PORT: "25599"
      LEVEL: shadow
      MOTD: "千灯纪 · 主世界"
      DIFFICULTY: easy
      ONLINE_MODE: "false"
      WHITE_LIST: "false"
      SPAWN_PROTECTION: "0"
      PVP: "false"
      VIEW_DISTANCE: "6"
      SIMULATION_DISTANCE: "6"
      ENABLE_COMMAND_BLOCK: "true"
      ENABLE_RCON: "true"
      RCON_PORT: "25575"
      RCON_PASSWORD: ${RCON_PASSWORD}
      COPY_MODS: "true"
      GUI: "false"
      TZ: Asia/Shanghai
      # 2026-08-26 天神补：settlementsfix 三键走 JVM_OPTS 持久注入（itzg 启动脚本每次重写 user_jvm_args.txt，直接编辑该文件会被抹掉）
      JVM_OPTS: "-Dsettlementsfix.interactFile=/mcdata/village/interact-events.jsonl -Dsettlementsfix.spellFile=/mcdata/spell-requests.jsonl -Dsettlementsfix.statusFile=/mcdata/status-requests.jsonl"
    ports:
      - "25599:25599"
      - "25575:25575"
    volumes:
      - ./mc:/data
      - ./mods:/mods:ro
      - ./mcdata:/mcdata   # 2026-08-26 天神补挂：settlementsfix 事件流（interact/spell/status）落村运营目录，与 qwenpaw /mcdata 同源
    networks: [shadow]

  # ── 瓶中 QwenPaw：守卫魂的家（8088 console/chat；mcp_numen 随行）──
  qwenpaw:
    image: qwenpaw-mc:2.1.1
    container_name: shadow-qwenpaw
    restart: unless-stopped
    command: ["qwenpaw", "app", "--host", "0.0.0.0", "--port", "8088"]
    volumes:
      - ./copaw:/root/.copaw
      - ./copaw.secret:/root/.copaw.secret
      - ./data:/data          # mcp_numen 的 pray/chant 落同一神使通道卷
      - ./mc/god-channel:/god-channel   # 运营双 agent（灯语/灶火）的神使通道（零密钥文件 IPC）
      - ./mcdata:/mcdata      # NPC 运营卷：灶火经 npc_read/npc_write 编排村民与任务板（写限 village/）
    environment:
      TZ: Asia/Shanghai
      MC_RCON_HOST: mc
      MC_RCON_PORT: "25575"
      RCON_PASSWORD: ${RCON_PASSWORD}
      WORLD_DATA: /data
    ports:
      - "18088:8088"          # 调试口
    networks: [shadow]

  # ── 守卫桥（账本落 ./data 卷 = 神使通道 IPC）──
  guard:
    image: mc-sidecar:2.1.0
    container_name: shadow-guard
    restart: unless-stopped
    command: ["python3", "-u", "/opt/sidecar/guard/guard_drive.py"]
    volumes:
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
      QWENPAW_CONSOLE_URL: http://qwenpaw:8088/api/console/chat
      MC_RCON_HOST: mc
      MC_RCON_PORT: "25575"
      RCON_PASSWORD: ${RCON_PASSWORD}
      MC_DATA_DIR: /data
    networks: [shadow]
    depends_on: [qwenpaw]

  # ── 女神化身 / 世界进程（bot 连容器 MC；RCON+logwatch+神使通道）──
  # 2.1.1 = 2.1.0 + canvas 垫片（@napi-rs/canvas），MC_VIEWER=1 开女神天眼 prismarine-viewer：
  # 第三人称 3050 / 第一人称 3150，宿主直通供 9090 面板 iframe 嵌入（无穿越者时兜底画面）
  # 2.1.2 = 2.1.1 + 观察者化身（MC_OBSERVER=1 关物理）：修 9090 面板「小人一直往下掉」
  # ——mineflayer 本地重力模拟与天眼 RCON tp 互搏，永动下坠 + moved too quickly 刷屏。
  # 2.1.3 = 2.1.2 + 天眼镜头跟随双修：①观察者 forcedMove→补发 move（viewer 才推镜头/加载
  # 区块）②web 端 bundle follow=smart 增量跟镜头（stock 第三人称只摆一次相机）。
  world:
    image: mc-world:2.2.0
    container_name: shadow-world
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./mc/logs:/mclogs:ro
      - ./mc/world/advancements:/mcadv:ro
    environment:
      TZ: Asia/Shanghai
      MC_HOST: mc
      MC_PORT: "25599"
      MC_RCON_HOST: mc
      MC_RCON_PORT: "25575"
      MC_DATA_DIR: /app/data
      MC_LOG_PATH: /mclogs/latest.log
      MC_ADVANCEMENTS_DIR: /mcadv
      MC_VIEWER: "1"
      MC_VIEWER_PORT: "3050"
      MC_OBSERVER: "1"      # 观察者化身：spawn 后关物理，位置只随 RCON tp 镜像（不掉落）
      MC_QDRANT_URL: http://memos-qdrant:6333       # 众生册向量库 → 瓶中 MemOS 栈（自包含）
      MC_EMBEDDING_URL: http://embed:11434          # 众生册 embedding → 瓶中轻量 embed（e5-large 1024d）
      OLLAMA_EMBED_URL: http://embed:11434/api/embeddings  # mc-magic.ts 向量咒语匹配（legacy 协议，embed 服务已补兼容端点）
      QWENPAW_CONSOLE_URL: http://qwenpaw:8088/api/console/chat
      TERRAIN_FILL: "0"     # 容器内无宿主 python/terrain_repair.py，禁用每日填坑 spawn
    ports:
      - "127.0.0.1:3050:3050"   # 女神天眼·第三人称（面板 iframe）
      - "127.0.0.1:3150:3150"   # 女神天眼·第一人称
    networks: [shadow]
    depends_on: [mc]

  # ── 基岩版入口（2026-08-26 终局：不走容器，宿主直跑）──
  # 实测三连否决：Docker Desktop(Windows) 的端口发布层不绑 UDP 到宿主——
  # useVpnkit true/false 皆然（netstat 查无监听）；WSL mirrored 早已生效但 DD 的
  # system 发行版不参与 mirrored。容器内 Geyser 一切正常（网内 RakNet PONG），
  # 就是出不了宿主 → 局域网手机无门。正解 = 宿主进程：
  #   ops/docker/shadow/viaproxy/start-viaproxy.bat（cli 模式，勿裸跑=GUI 模式会
  #   等一个永远无人点的 Start 按钮）+ start-viaproxy-hidden.vbs 隐窗；
  #   自启 = 计划任务 ViaProxy-Bedrock-Entry（ONLOGON）。
  # 链路：基岩客户端 --UDP 19140--> Geyser(插件) --Java--> ViaProxy --1.21.1--> 127.0.0.1:25599
  # 端口史：19132 系统隐身占用；19133 DD 重启后留 mirrored 僵尸预留（bind 报 10048
  # 却查无进程，wsl --shutdown/重启才能清）→ 19140 定居。Geyser 端口在
  # viaproxy/plugins/Geyser/config.yml。容器版历史方案见 git log。

  # ── 面板（web-panel.mjs，node:sqlite 读 world.db）──
  panel:
    # 2.1.5 = 2.1.0(骨架) + pv=8 镜头跟随 + /api/inspect 众生档案（RCON 实查状态/背包）
    # + 服务器特色卡：任务板（公会委托·mcdata 卷）/ 修为榜 / 法则技艺谱。
    image: mc-world:2.2.0
    container_name: shadow-panel
    restart: unless-stopped
    entrypoint: []
    command: ["node", "web-panel.mjs"]
    volumes:
      - ./data:/app/data
      - ./mcdata:/mcdata:ro  # 村庄活数据：任务板/声望/流水（npc 侧写、panel 只读展示）
      - ./mc/logs:/mclogs:ro
    environment:
      TZ: Asia/Shanghai
      PANEL_PORT: "9090"
      MC_DATA_DIR: /app/data
      MC_QUEST_DIR: /mcdata/village
      MC_LOG_PATH: /mclogs/latest.log
      MC_RCON_HOST: mc
      MC_RCON_PORT: "25575"
    ports:
      - "9090:9090"
    networks: [shadow]

  # ── 村民之魂（mcdata 卷；听 log + RCON 发言）──
  npc:
    image: mc-sidecar:2.1.0
    container_name: shadow-npc
    restart: unless-stopped
    command: ["python3", "-u", "/opt/sidecar/mc_npc.py"]
    volumes:
      - ./mcdata:/mcdata
      - ./data:/data
      - ./mc/logs:/mclogs:ro
    environment:
      TZ: Asia/Shanghai
      NPC_DATA_DIR: /mcdata
      NPC_LOG_PATH: /mclogs/latest.log
      MC_RCON_HOST: mc
      MC_RCON_PORT: "25575"
      RCON_PASSWORD: ${RCON_PASSWORD}
      MC_DATA_DIR: /data
    networks: [shadow]

  # ── 村民神谕推理（SIS 直连 vllm，endpoint 已在 mcdata 配置里打补丁）──
  oracle:
    image: mc-sidecar:2.1.0
    container_name: shadow-oracle
    restart: unless-stopped
    command: ["python3", "-u", "/opt/sidecar/mc_oracle.py"]
    volumes:
      - ./mcdata:/mcdata
    environment:
      TZ: Asia/Shanghai
      ORACLE_BIND: 0.0.0.0   # 容器网内 settlements mod 经 oracle:9001 访问
      NPC_DATA_DIR: /mcdata
      MC_RCON_HOST: mc
      MC_RCON_PORT: "25575"
      RCON_PASSWORD: ${RCON_PASSWORD}
    networks: [shadow]

  # ── 运营双桥：驱动灯语女神(巡检修世界)/灶火祭司(世界观播报) ──
  opsdrive:
    image: mc-sidecar:2.1.0
    container_name: shadow-opsdrive
    restart: unless-stopped
    command: ["python3", "-u", "/opt/sidecar/ops/ops_drive.py"]
    volumes:
      - ./data:/data
      - ./mc/god-channel:/god-channel:ro
    environment:
      TZ: Asia/Shanghai
      QWENPAW_CONSOLE_URL: http://qwenpaw:8088/api/console/chat
      GOD_CHANNEL_DIR: /god-channel
      DATA_DIR: /data
      HERALD_EVERY_SEC: "600"    # 灯语巡检周期
      PRIEST_EVERY_SEC: "3600"   # 灶火策划周期
    networks: [shadow]
    depends_on: [qwenpaw]

  # ══════════════════════════════════════════════════════════════
  # MemOS 瓶中记忆栈（2026-08-25 收编：镜像/参数照抄宿主机 memos-deploy，
  # 数据独立于宿主机 memos；LLM 借道 8890，embedding 走瓶中 ollama）
  # ══════════════════════════════════════════════════════════════
  memos-redis:
    image: redis:7-alpine
    container_name: shadow-memos-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./memos-data/redis:/data
    restart: unless-stopped
    networks: [shadow]

  memos-qdrant:
    image: qdrant/qdrant:v1.15.3
    container_name: shadow-memos-qdrant
    volumes:
      - ./memos-data/qdrant:/qdrant/storage
    restart: unless-stopped
    networks: [shadow]

  memos-neo4j:
    image: neo4j:5.26.6
    container_name: shadow-memos-neo4j
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH: "neo4j/memos123"
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - ./memos-data/neo4j:/data
      - ./memos-data/neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
    restart: unless-stopped
    networks: [shadow]

  memos-api:
    image: memos-api:local
    container_name: shadow-memos-api
    environment:
      TZ: Asia/Shanghai
      PYTHONPATH: /app/src
      ENABLE_CHAT_API: "true"
      MOS_CHAT_MODEL: qwen3.8-27b-uncensored
      # chat LLM：借道宿主 8890（同 daemon 的 vllm 容器口；整机迁移见下方 vllm profile）
      CHAT_MODEL_LIST: '[{"backend":"openai","model_name_or_path":"qwen3.8-27b-uncensored","temperature":0.8,"max_tokens":4096,"top_p":0.95,"api_key":"local","api_base":"http://host.docker.internal:8890/v1","support_models":["qwen3.8-27b-uncensored","qwen3.6-27b"]}]'
      OPENAI_API_BASE: http://host.docker.internal:8890/v1
      MEMRADER_MODEL: qwen3.8-27b-uncensored
      MEMREADER_GENERAL_MODEL: qwen3.8-27b-uncensored
      MEMRADER_API_BASE: http://host.docker.internal:8890/v1
      MEMREADER_GENERAL_API_BASE: http://host.docker.internal:8890/v1
      # embedding：瓶中轻量 embed 服务（e5-large 1024d，假 ollama 协议）
      OLLAMA_API_BASE: http://embed:11434
      MOS_EMBEDDER_BACKEND: ollama
      MOS_EMBEDDER_MODEL: intfloat/multilingual-e5-large
      EMBEDDING_DIMENSION: "1024"
      NEO4J_URI: bolt://memos-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: memos123
      QDRANT_HOST: memos-qdrant
      QDRANT_PORT: "6333"
      MOS_CUBE_PATH: /data
      MEMSCHEDULER_USE_REDIS_QUEUE: "true"
      MEMSCHEDULER_REDIS_HOST: memos-redis
      MEMSCHEDULER_REDIS_PORT: "6379"
      MOS_ENABLE_SCHEDULER: "false"
      API_SCHEDULER_ON: "true"
      ENABLE_INTERNET: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ./memos-data/api:/data
    depends_on:
      memos-neo4j:
        condition: service_healthy
      memos-qdrant:
        condition: service_started
      memos-redis:
        condition: service_started
    restart: unless-stopped
    networks: [shadow]

  memos-mcp:
    image: memos-api:local
    container_name: shadow-memos-mcp
    command: ["python", "examples/mem_mcp/simple_fastmcp_serve.py", "--transport", "http", "--host", "0.0.0.0", "--port", "8003"]
    environment:
      PYTHONPATH: /app/src
      MEMOS_API_BASE_URL: http://memos-api:8000/product
    depends_on: [memos-api]
    restart: unless-stopped
    networks: [shadow]

  # 轻量 embedding（2026-08-26 替代 ollama）：假 ollama 协议（/api/embed + /api/tags），
  # 后端 fastembed ONNX CPU · multilingual-e5-large（1024d 多语言，与众生册硬编码维度一致）。
  # 镜像自带模型，运行时离线。云端预案：EMBED_OPENAI_BASE_URL 指向 dashscope/硅基流动
  # 等 OpenAI 兼容端点即走云端（纯 CPU 云机可省 2.2GB 模型）。
  embed:
    build:
      context: ../embed
    image: mc-embed:1.0
    container_name: shadow-embed
    environment:
      EMBED_MODEL: intfloat/multilingual-e5-large
      FASTEMBED_CACHE: /data/fastembed
      # 云端模式示例（二选一，留空=本地 ONNX）：
      # EMBED_OPENAI_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      # EMBED_OPENAI_MODEL: text-embedding-v4
      # EMBED_OPENAI_API_KEY: sk-xxx
    volumes:
      - ./embed-data:/data
    restart: unless-stopped
    networks: [shadow]

  # vllm 搬家预案：默认不起（GPU 显存单份，现役 vllm-qwen38-ara 占用中）。
  # 整机迁移时：docker compose --env-file shadow.env --profile gpu up -d vllm
  # （须先停掉原 vllm 容器；模型卷 ara-nvfp4 + 编译缓存卷随 docker 卷迁移）
  vllm:
    profiles: ["gpu"]
    image: vllm/vllm-openai:qwen38-x86_64-cu130
    container_name: shadow-vllm
    command: ["--model", "/models", "--served-model-name", "qwen3.8-27b-uncensored", "qwen3.8-27b-unc", "qwen3.8-27b", "qwen3.8", "qwen3.6-27b", "--max-model-len", "262144", "--kv-cache-dtype", "fp8", "--gpu-memory-utilization", "0.75", "--max-num-seqs", "64", "--speculative-config", "{\"method\":\"mtp\",\"num_speculative_tokens\":3}", "--enable-auto-tool-choice", "--tool-call-parser", "qwen3_coder", "--reasoning-parser", "qwen3"]
    environment:
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
    volumes:
      - ara-nvfp4:/models:ro
      - vllm_compile_cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    networks: [shadow]

networks:
  shadow:
    name: shadow_net

volumes:
  ara-nvfp4:
    external: true
  vllm_compile_cache:
    external: true
