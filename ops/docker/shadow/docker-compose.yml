# 鍗冪伅绾?Phase B 鈥?褰卞瓙鐜缂栨帓锛堜笉鍔ㄧ敓浜э紱绔彛 25899/25880/18088/19090锛?# 鍓嶇疆锛歱ython build-shadow.py 鐢熸垚 mods/data/mcdata/copaw/copaw.secret/mc 鍗?# 鍚姩锛歝d ops/docker/shadow && docker compose --env-file shadow.env up -d
# 鍏ㄦ櫙锛歮c(qwenpaw 瀹跺) + world(濂崇鍖栬韩) + panel + qwenpaw(瀹堝崼榄? + guard(瀹堝崼妗? + npc + oracle
name: shadow

services:
  # 鈹€鈹€ MC 涓绘湇锛堢敓浜?modpack + god-channel 鐗?numen_act锛夆攢鈹€
  mc:
    image: itzg/minecraft-server:java21
    container_name: shadow-mc
    restart: unless-stopped
    environment:
      # 鈹€鈹€ 涓栫晫鑷姩澶囦唤锛坕tzg 鍘熺敓锛屾瘡鏃?04:00 tar 杩?data 鍗?backups/锛屼繚鐣?7 浠斤級鈹€鈹€
      BACKUP_INTERVAL: "0 4 * * *"
      BACKUP_RETENTION_LIMIT: "7"
      BACKUP_METHOD: "tar"
      EULA: "TRUE"
      TYPE: NEOFORGE
      VERSION: "1.21.1"
      NEOFORGE_VERSION: "21.1.248"
      MEMORY: 3G
      SERVER_PORT: "25599"
      LEVEL: shadow
      MOTD: "千灯纪 · 主世界"
      DIFFICULTY: easy
      ONLINE_MODE: "false"
      WHITE_LIST: "false"
      SPAWN_PROTECTION: "0"
      PVP: "false"
      VIEW_DISTANCE: "6"
      SIMULATION_DISTANCE: "6"
      ENABLE_COMMAND_BLOCK: "true"
      ENABLE_RCON: "true"
      RCON_PORT: "25575"
      RCON_PASSWORD: ${RCON_PASSWORD}
      COPY_MODS: "true"
      GUI: "false"
      TZ: Asia/Shanghai
      # settlementsfix three-key persistent injection via JVM_OPTS (itzg rewrites user_jvm_args.txt on every start)
      # testHooks: /skillchest click 测试钩子（E2E 用；生产稳定后可移除）
      JVM_OPTS: "-Dsettlementsfix.interactFile=/mcdata/village/interact-events.jsonl -Dsettlementsfix.spellFile=/mcdata/spell-requests.jsonl -Dsettlementsfix.statusFile=/mcdata/status-requests.jsonl -Dsettlementsfix.mcdataDir=/mcdata -Dsettlementsfix.testHooks=true"
    ports:
      # 2026-08-28 方案B：25599 对外映射撤销——宿主 25599 由 host_tcp_relay 接管转 gate:25700，
      # 裸原版客户端（Taro/Codex/Edward/真人）连 25599 自动过门完成 NeoForge 协商。
      # gate 容器经 shadow 网内 mc:25599 直连，不依赖宿主映射。
      - "25575:25575"
      - "24454:24454/udp"   # 2026-08-30 Simple Voice Chat UDP（客户端语音；NAS voicechat-neoforge-1.21.1-2.6.22 上服）
    volumes:
      - ./mc:/data
      - ./mc/mods:/mods:ro   # 2026-08-29 修正: 同 ./mc/mods(即 /data/mods),itzg COPY_MODS 自拷幂等;旧 ./mods 已退役
      - ./mcdata:/mcdata   # 2026-08-26 澶╃琛ユ寕锛歴ettlementsfix 浜嬩欢娴侊紙interact/spell/status锛夎惤鏉戣繍钀ョ洰褰曪紝涓?qwenpaw /mcdata 鍚屾簮
      # 2026-08-30 RoadWeaver data -> named volume: bind mount(gRPC-FUSE) EIO on RW atomic small-file writes killed RoadGenerationService tasks (planned roads never woven into world). Container-native ext4 = no EIO. Old bind data damaged, RW rescans on restart.
      - roadweaver-data:/data/shadow/data/roadweaver
    networks: [shadow]

  # 鈹€鈹€ 鐡朵腑 QwenPaw锛氬畧鍗瓊鐨勫锛?088 console/chat锛沵cp_numen 闅忚锛夆攢鈹€
  qwenpaw:
    image: qwenpaw-mc:2.1.1
    container_name: shadow-qwenpaw
    restart: unless-stopped
    command: ["qwenpaw", "app", "--host", "0.0.0.0", "--port", "8088"]
    volumes:
      - ./copaw:/root/.copaw
      - ./copaw.secret:/root/.copaw.secret
      - ./data:/data
      - ./mc/god-channel:/god-channel
      - ./mcdata:/mcdata
    environment:
      TZ: Asia/Shanghai
      MC_RCON_HOST: mc
      MC_RCON_PORT: "25575"
      RCON_PASSWORD: ${RCON_PASSWORD}
      WORLD_DATA: /data
    ports:
      - "18088:8088"
    networks: [shadow]

  # 鈹€鈹€ 瀹堝崼妗ワ紙璐︽湰钀?./data 鍗?= 绁炰娇閫氶亾 IPC锛夆攢鈹€
  guard:
    image: mc-sidecar:2.1.0
    container_name: shadow-guard
    restart: unless-stopped
    command: ["python3", "-u", "/opt/sidecar/guard/guard_drive.py"]
    volumes:
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
      QWENPAW_CONSOLE_URL: http://qwenpaw:8088/api/console/chat
      MC_RCON_HOST: mc
      MC_RCON_PORT: "25575"
      RCON_PASSWORD: ${RCON_PASSWORD}
      MC_DATA_DIR: /data
    networks: [shadow]
    depends_on: [qwenpaw]

  # 鈹€鈹€ 濂崇鍖栬韩 / 涓栫晫杩涚▼锛坆ot 杩炲鍣?MC锛汻CON+logwatch+绁炰娇閫氶亾锛夆攢鈹€
  # 2.1.1 = 2.1.0 + canvas 鍨墖锛園napi-rs/canvas锛夛紝MC_VIEWER=1 寮€濂崇澶╃溂 prismarine-viewer锛?  # 绗笁浜虹О 3050 / 绗竴浜虹О 3150锛屽涓荤洿閫氫緵 9090 闈㈡澘 iframe 宓屽叆锛堟棤绌胯秺鑰呮椂鍏滃簳鐢婚潰锛?  # 2.1.2 = 2.1.1 + 瑙傚療鑰呭寲韬紙MC_OBSERVER=1 鍏崇墿鐞嗭級锛氫慨 9090 闈㈡澘銆屽皬浜轰竴鐩村線涓嬫帀銆?  # 鈥斺€攎ineflayer 鏈湴閲嶅姏妯℃嫙涓庡ぉ鐪?RCON tp 浜掓悘锛屾案鍔ㄤ笅鍧?+ moved too quickly 鍒峰睆銆?  # 2.1.3 = 2.1.2 + 澶╃溂闀滃ご璺熼殢鍙屼慨锛氣憼瑙傚療鑰?forcedMove鈫掕ˉ鍙?move锛坴iewer 鎵嶆帹闀滃ご/鍔犺浇
  # 鍖哄潡锛夆憽web 绔?bundle follow=smart 澧為噺璺熼暅澶达紙stock 绗笁浜虹О鍙憜涓€娆＄浉鏈猴級銆?
  # 2026-08-28 gate sidecar（神社之门）：NeoForge 握手中继，正门 25700 -> 后程 mc:25599。
  # IA/drones mod 注册必需网络通道后，裸 mineflayer 必须经此协商进门（CONFIG 自答 neoforge:*，
  # PLAY 全双向透传；首次通道清单变化时以探针叩门自动学习，2 轮内完成）。
  gate:
    image: mc-world:2.1.38
    container_name: shadow-gate
    restart: unless-stopped
    entrypoint: []
    command: ["node", "/app/src/neoforge-handshake/gate.cjs", "25700", "mc", "25599"]
    environment:
      TZ: Asia/Shanghai
    # 2026-08-28 gate 收编宿主入口：局域网 bot（Taro/Codex 走 25565 relay）与本机 bot（爱德华/dsh）
    # 统一经门过 NeoForge 协商；源码卷挂载=工作区即生产，keepAlive 修复永不再丢
    ports: ["25700:25700"]
    volumes:
      - ../../../src/neoforge-handshake:/app/src/neoforge-handshake:ro
    networks: [shadow]
    depends_on: [mc]

  # 2026-08-28 真人直连口（mc-direct）：gate 只懂原版协议协商，真人 NeoForge 客户端过门
  # 会被拒（"服务器没有使用 NeoForge"）——故给真人一条纯 TCP 通路：宿主 25565 relay ->
  # 127.0.0.1:25566（loopback-only 发布）-> 此容器 socat 纯转发 -> mc:25599（服务名解析不怕 IP 变）。
  # 宿主直连容器 IP 不可达=WSL2 隔离，此中转不可省。
  mc-direct:
    image: alpine:latest
    container_name: mc-direct
    restart: unless-stopped
    entrypoint: []
    command: ["sh", "-c", "apk add --no-cache socat >/dev/null 2>&1 && exec socat -d tcp-listen:25599,fork,reuseaddr tcp:mc:25599"]
    environment:
      TZ: Asia/Shanghai
    ports: ["25566:25599"]
    networks: [shadow]
    depends_on: [mc]

  world:
    image: mc-world:2.1.38
    container_name: shadow-world
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ../../../src:/app/src:ro
      # 2026-08-29 固化：世界主入口 bind-mount（此前镜像 COPY 态，改码须重新 build 才生效）
      - ../../../bootstrap-world.mts:/app/bootstrap-world.mts:ro
      - ./mcdata:/mcdata   # 2026-08-29 修只读断供：灯语聊天读档案保留，同时 world 必须写 web-entities.json（9090 实体快照每 1.5s，ro 曾致前端冻结 4 天）
      - ./mc/logs:/mclogs:ro
      # 2026-08-29 修成就监听瞎眼:真实世界目录是 shadow/,此前误挂 mc/world/
      # (空目录)→ 桐人 206 项/鸣人 219 项成就从未被读到,历练通道(成就→
      # 解锁+发经验)自上线未工作过。shadow/ 才是真档。
      - ./mc/shadow/advancements:/mcadv:ro
      # 2026-08-29 修为折算器：numen 假玩家不吸经验球（贴脸实测 XpTotal 不动），
      # 杀怪经验全蒸发 → world 侧读 stats json（UUID 文件）按 mob_kills delta 补 xp。
      - ./mc/shadow/stats:/mcstats:ro
      # 2026-08-29 天音接线:女神说话投文本任务 → 宿主 god-voice-watcher 合成 →
      # god-voice mod(SVC) 在女神实体头顶播放,装 SVC 客户端的玩家(萌萌)可听。
      - ./mc/data/godvoice:/godvoice
    environment:
      TZ: Asia/Shanghai
      # 2026-08-30 直连回归：settlementsfix ConfigTaskGateForNonNeoForgeMixin 上线后，
      # 非 NeoForge 客户端的 mod CONFIG 任务被服务端直接滤除，裸 mineflayer 直连
      # mc:25599 已畅通（Goddess 实测过 CONFIG 入 PLAY）。gate 边车保留服务
      # （Taro 等穿越者仍走 gate），但 world 的女神化身不再绕行——少一跳翻译层，
      # 少一处包错位（gate 在 Curios/Sophisticated 上服后 PLAY 期解析错位）。
      # 历史注（2026-08-28 神社之门收编）：IA/drones mod 注册必需网络通道后，裸
      # mineflayer 直连会被 NeoForge CONFIG 期拒（"you are not running NeoForge"），
      # 当时的解法是 world 的 bot 一律走 gate:25700 协商边车。
      MC_HOST: mc
      MC_PORT: "25599"
      MC_RCON_HOST: mc
      MC_RCON_PORT: "25575"
      MC_DATA_DIR: /app/data
      GODVOICE_DIR: /godvoice   # 天音:女神公屏说话落此目录 text-queue/,宿主 watcher 合成 mp3 后由 mod 播放
      MC_LOG_PATH: /mclogs/latest.log
      MC_ADVANCEMENTS_DIR: /mcadv
      MC_VIEWER: "1"
      MC_VIEWER_PORT: "3050"
      MC_MAP_PORT: "3060"    # 灏忓湴鍥惧湴褰?tile 鏈嶅姟锛?090 闈㈡澘灏忓湴鍥惧簳鍥撅級
      MC_MODERN_VIEWER: "1"    # 鐜颁唬鐢婚潰锛堣悓鎮?Three.js 娓叉煋锛夛細闈㈡澘榛樿 iframe
      MC_MODERN_VIEWER_PORT: "3070"
      MC_PANEL_ORIGIN: http://127.0.0.1:9090
      MC_OBSERVER: "1"
      MC_QDRANT_URL: http://memos-qdrant:6333
      MC_EMBEDDING_URL: http://embed:11434
      OLLAMA_EMBED_URL: http://embed:11434/api/embeddings
      QWENPAW_CONSOLE_URL: http://qwenpaw:8088/api/console/chat
      TERRAIN_FILL: "0"     # 瀹瑰櫒鍐呮棤瀹夸富 python/terrain_repair.py锛岀鐢ㄦ瘡鏃ュ～鍧?spawn
    ports:
      - "127.0.0.1:3050:3050"
      - "127.0.0.1:3150:3150"
      - "127.0.0.1:3060:3060"   # 灏忓湴鍥惧湴褰?tile 鏈嶅姟锛堥潰鏉?Image() 鎷夊彇锛屾棤 CORS 闇€姹傦級
      - "127.0.0.1:3070:3070"
    networks: [shadow]
    depends_on: [mc]

  # 鈹€鈹€ 鍩哄博鐗堝叆鍙ｏ紙2026-08-26 缁堝眬锛氫笉璧板鍣紝瀹夸富鐩磋窇锛夆攢鈹€
  # 瀹炴祴涓夎繛鍚﹀喅锛欴ocker Desktop(Windows) 鐨勭鍙ｅ彂甯冨眰涓嶇粦 UDP 鍒板涓烩€斺€?  # useVpnkit true/false 鐨嗙劧锛坣etstat 鏌ユ棤鐩戝惉锛夛紱WSL mirrored 鏃╁凡鐢熸晥浣?DD 鐨?  # system 鍙戣鐗堜笉鍙備笌 mirrored銆傚鍣ㄥ唴 Geyser 涓€鍒囨甯革紙缃戝唴 RakNet PONG锛夛紝
  # 灏辨槸鍑轰笉浜嗗涓?鈫?灞€鍩熺綉鎵嬫満鏃犻棬銆傛瑙?= 瀹夸富杩涚▼锛?  #   ops/docker/shadow/viaproxy/start-viaproxy.bat锛坈li 妯″紡锛屽嬁瑁歌窇=GUI 妯″紡浼?  #   绛変竴涓案杩滄棤浜虹偣鐨?Start 鎸夐挳锛? start-viaproxy-hidden.vbs 闅愮獥锛?  #   鑷惎 = 璁″垝浠诲姟 ViaProxy-Bedrock-Entry锛圤NLOGON锛夈€?  # 閾捐矾锛氬熀宀╁鎴风 --UDP 19140--> Geyser(鎻掍欢) --Java--> ViaProxy --1.21.1--> 127.0.0.1:25599
  # 绔彛鍙诧細19132 绯荤粺闅愯韩鍗犵敤锛?9133 DD 閲嶅惎鍚庣暀 mirrored 鍍靛案棰勭暀锛坆ind 鎶?10048
  # 鍗存煡鏃犺繘绋嬶紝wsl --shutdown/閲嶅惎鎵嶈兘娓咃級鈫?19140 瀹氬眳銆侴eyser 绔彛鍦?  # viaproxy/plugins/Geyser/config.yml銆傚鍣ㄧ増鍘嗗彶鏂规瑙?git log銆?
  # 鈹€鈹€ 闈㈡澘锛坵eb-panel.mjs锛宯ode:sqlite 璇?world.db锛夆攢鈹€
  panel:
    image: mc-world:2.2.4
    container_name: shadow-panel
    restart: unless-stopped
    entrypoint: []
    command: ["node", "web-panel.mjs"]
    volumes:
      - ./data:/app/data
      # 2026-08-29 固化：面板源码走 B 仓 bind-mount（此前 docker cp 态，容器重建即丢
      # 「神明飞临」等热修）。与 world 服务 src 卷同套路，单一事实源=B 仓。
      - ../../../web-panel.mjs:/app/web-panel.mjs:ro
      - ./mcdata:/mcdata:ro
      - ./mc/logs:/mclogs:ro
    environment:
      TZ: Asia/Shanghai
      PANEL_PORT: "9090"
      MC_DATA_DIR: /app/data
      MC_QUEST_DIR: /mcdata/village
      MC_LOG_PATH: /mclogs/latest.log
      MC_RCON_HOST: mc
      MC_RCON_PORT: "25575"
    ports:
      - "9090:9090"
    networks: [shadow]

  # 鈹€鈹€ 鐜╁闂ㄦ埛缃戝叧锛坢c_gateway.py 绾爣鍑嗗簱锛涚櫥褰?娉ㄥ唽/妯＄粍娓呭崟鍒嗗彂/鐨偆涓婁紶锛夆攢鈹€
  # 2026-08-26 鏀剁紪鍏ユ爤锛氬涓绘満鐩磋窇杩涚▼涓嬬嚎锛?011 鐢卞鍣ㄦ帴绠★紙瀹㈡埛绔富鐧诲綍鍏ュ彛锛夈€?  # 璐﹀彿搴?鐨偆杩佺Щ鑷?B 浠?mc-data/gateway/銆侻C_SERVER_DIR=/server 鍙槸鐩綍楠ㄦ灦锛?  # mods 涓?logs锛坙atest.log SCAN 琛?= 瀹為檯鍔犺浇娓呭崟锛夌敱鏈湇鍔″彧璇绘寕鍏ワ紱
  # world.db 璧?./data 鍗凤紙瀹堟姢澶╀娇璁や富鐧昏涓庨潰鏉?绁炰娇鍚屾簮锛夈€?
  gateway:
    image: mc-gateway:1.0.1
    container_name: shadow-gateway
    restart: unless-stopped
    volumes:
      - ./data:/data
      # 2026-08-29 固化：网关源码 bind-mount（镜像 1.0.1 里的代码已过时，以 B 仓为单一事实源）
      - ../../../mc-gateway/mc_gateway.py:/opt/gateway/mc_gateway.py:ro
      - ./mc/mods:/server/mods:ro   # 2026-08-29 修正: MC 容器目录重构后 mods 在 mc/ 下,旧 ./mods 是过时副本
      - ./mc/logs:/server/logs:ro
    environment:
      TZ: Asia/Shanghai
      GATEWAY_PORT: "8011"
      MC_DATA_DIR: /data
      MC_SERVER_DIR: /server
      RCON_HOST: mc
      RCON_PORT: "25575"
      RCON_PASSWORD: ${RCON_PASSWORD}
      GATEWAY_ADVERTISE: 192.168.3.133
    ports:
      - "8011:8011"        # 灞€鍩熺綉瀹㈡埛绔富鐧诲綍鍏ュ彛
    networks: [shadow]
    depends_on: [mc]

  # 鈹€鈹€ 鏉戞皯涔嬮瓊锛坢cdata 鍗凤紱鍚?log + RCON 鍙戣█锛夆攢鈹€
  npc:
    image: mc-sidecar:2.1.0
    container_name: shadow-npc
    restart: unless-stopped
    command: ["python3", "-u", "/opt/sidecar/mc_npc.py"]
    volumes:
      - ./mcdata:/mcdata
      - ./data:/data
      - ./mc/logs:/mclogs:ro
    environment:
      TZ: Asia/Shanghai
      NPC_DATA_DIR: /mcdata
      NPC_LOG_PATH: /mclogs/latest.log
      MC_RCON_HOST: mc
      MC_RCON_PORT: "25575"
      RCON_PASSWORD: ${RCON_PASSWORD}
      MC_DATA_DIR: /data
    networks: [shadow]

  # 鈹€鈹€ 鏉戞皯绁炶皶鎺ㄧ悊锛圫IS 鐩磋繛 vllm锛宔ndpoint 宸插湪 mcdata 閰嶇疆閲屾墦琛ヤ竵锛夆攢鈹€
  # ── shadow-asr：天耳转写（mic_asr_watcher 容器化，2026-08-31 进程收编 docker 首例）
  # 数据面：inbox 由 shadow-mc（SVC mod 落 wav）写入；outbox 由 world 的 mc-god.ts 消费
  # （GODVOICE_DIR 卷链路：./mc/data/godvoice ↔ /godvoice ↔ /mic 同一宿主目录）。
  # 模型 bind 只读（82MB int8，宿主权威路径）；restart=unless-stopped 顶替散养看门狗。
  asr:
    build:
      context: ./god-voice
    image: mc-voice:1.0
    container_name: shadow-asr
    restart: unless-stopped
    volumes:
      - ./mc/data/godvoice:/godvoice
      - C:/Users/lzl19/.copaw/workspaces/mc-god/sherpa-onnx-paraformer-zh-small-2024-03-09:/model:ro
    environment:
      TZ: Asia/Shanghai
      MIC_BASE: /godvoice/mic
      ASR_MODEL_DIR: /model
    networks: [shadow]
    depends_on: [mc]

  # ── shadow-voice：天音合成中继（sidecar/god-voice-watcher 容器化，2026-08-31 补编）。
  # 前因：08-31 进程大清理时宿主实例被误杀（身份未查即入 22 尸名单），天音断线数小时——
  # 教训已刻 LESSONS。同款镜像、bind 挂源码（改码即换岗，同 sentinel/oncall 路数）。
  voice:
    image: mc-voice:1.0
    container_name: shadow-voice
    restart: unless-stopped
    command: ["python", "-u", "/opt/asr/god-voice-watcher.py"]
    volumes:
      - ./mc/data/godvoice:/godvoice
      - ../../../sidecar/god-voice-watcher.py:/opt/asr/god-voice-watcher.py:ro
    environment:
      TZ: Asia/Shanghai
      GV_BASE: /godvoice
    networks: [shadow]
    depends_on: [mc]

  # ── shadow-sentinel：值班哨（mc_oncall 容器化，真人在场不许 AI 下班）。
  # 权限面：挂 docker.sock = 可操控全机容器，仅限本机内网栈，勿再透传。
  # 宿主 schtask mc-oncall 与 guard_drive_watchdog 同步退役（2026-08-31）。
  sentinel:
    build:
      context: ./sentinel
    image: mc-sentinel:1.0
    container_name: shadow-sentinel
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./mc/logs:/mclogs:ro
      - ../../../ops/mc_oncall.py:/opt/mc_oncall.py:ro
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
      ONCALL_LOG: /mclogs/latest.log
      ONCALL_LOG_FILE: /data/oncall.log
    networks: [shadow]
    depends_on: [mc]

  oracle:
    image: mc-sidecar:2.1.0
    container_name: shadow-oracle
    restart: unless-stopped
    command: ["python3", "-u", "/opt/sidecar/mc_oracle.py"]
    volumes:
      - ./mcdata:/mcdata
    environment:
      TZ: Asia/Shanghai
      ORACLE_BIND: 0.0.0.0   # 瀹瑰櫒缃戝唴 settlements mod 缁?oracle:9001 璁块棶
      NPC_DATA_DIR: /mcdata
      MC_RCON_HOST: mc
      MC_RCON_PORT: "25575"
      RCON_PASSWORD: ${RCON_PASSWORD}
    networks: [shadow]

  # 鈹€鈹€ 杩愯惀鍙屾ˉ锛氶┍鍔ㄧ伅璇コ绁?宸℃淇笘鐣?/鐏剁伀绁徃(涓栫晫瑙傛挱鎶? 鈹€鈹€
  opsdrive:
    image: mc-sidecar:2.1.0
    container_name: shadow-opsdrive
    restart: unless-stopped
    command: ["python3", "-u", "/opt/sidecar/ops/ops_drive.py"]
    volumes:
      - ./data:/data
      - ./mc/god-channel:/god-channel:ro
    environment:
      TZ: Asia/Shanghai
      QWENPAW_CONSOLE_URL: http://qwenpaw:8088/api/console/chat
      GOD_CHANNEL_DIR: /god-channel
      DATA_DIR: /data
      HERALD_EVERY_SEC: "600"    # 鐏宸℃鍛ㄦ湡
      PRIEST_EVERY_SEC: "3600"   # 鐏剁伀绛栧垝鍛ㄦ湡
    networks: [shadow]
    depends_on: [qwenpaw]

  # 鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲
  # MemOS 鐡朵腑璁板繂鏍堬紙2026-08-25 鏀剁紪锛氶暅鍍?鍙傛暟鐓ф妱瀹夸富鏈?memos-deploy锛?  # 鏁版嵁鐙珛浜庡涓绘満 memos锛汱LM 鍊熼亾 8890锛宔mbedding 璧扮摱涓?ollama锛?  # 鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲鈺愨晲
  memos-redis:
    image: redis:7-alpine
    container_name: shadow-memos-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./memos-data/redis:/data
    restart: unless-stopped
    networks: [shadow]

  memos-qdrant:
    image: qdrant/qdrant:v1.15.3
    container_name: shadow-memos-qdrant
    volumes:
      - ./memos-data/qdrant:/qdrant/storage
    restart: unless-stopped
    networks: [shadow]

  memos-neo4j:
    image: neo4j:5.26.6
    container_name: shadow-memos-neo4j
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH: "neo4j/memos123"
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - ./memos-data/neo4j:/data
      - ./memos-data/neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
    restart: unless-stopped
    networks: [shadow]

  memos-api:
    image: memos-api:local
    container_name: shadow-memos-api
    environment:
      TZ: Asia/Shanghai
      PYTHONPATH: /app/src
      ENABLE_CHAT_API: "true"
      MOS_CHAT_MODEL: qwen3.8-27b-uncensored
      # chat LLM via host vllm :8890 (qwenpaw profile below)
      CHAT_MODEL_LIST: '[{"backend":"openai","model_name_or_path":"qwen3.8-27b-uncensored","temperature":0.8,"max_tokens":4096,"top_p":0.95,"api_key":"local","api_base":"http://host.docker.internal:8890/v1","support_models":["qwen3.8-27b-uncensored","qwen3.6-27b"]}]'
      OPENAI_API_BASE: http://host.docker.internal:8890/v1
      MEMRADER_MODEL: qwen3.8-27b-uncensored
      MEMREADER_GENERAL_MODEL: qwen3.8-27b-uncensored
      MEMRADER_API_BASE: http://host.docker.internal:8890/v1
      MEMREADER_GENERAL_API_BASE: http://host.docker.internal:8890/v1
      # embedding: light embed stack (b5-large 1024d, ollama protocol)
      OLLAMA_API_BASE: http://embed:11434
      MOS_EMBEDDER_BACKEND: ollama
      MOS_EMBEDDER_MODEL: intfloat/multilingual-e5-large
      EMBEDDING_DIMENSION: "1024"
      NEO4J_URI: bolt://memos-neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: memos123
      QDRANT_HOST: memos-qdrant
      QDRANT_PORT: "6333"
      MOS_CUBE_PATH: /data
      MEMSCHEDULER_USE_REDIS_QUEUE: "true"
      MEMSCHEDULER_REDIS_HOST: memos-redis
      MEMSCHEDULER_REDIS_PORT: "6379"
      MOS_ENABLE_SCHEDULER: "false"
      API_SCHEDULER_ON: "true"
      ENABLE_INTERNET: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ./memos-data/api:/data
    # 2026-08-31 造物主定谳：宿主 memos-deploy 五件套退役，游戏记忆以本栈为唯一权威；
    # 8002:8000 接管宿主旧端口，宿主侧调用方（守卫桥/QwenPaw MCP）零改动无缝切换。
    ports:
      - "8002:8000"
    depends_on:
      memos-neo4j:
        condition: service_healthy
      memos-qdrant:
        condition: service_started
      memos-redis:
        condition: service_started
    restart: unless-stopped
    networks: [shadow]

  memos-mcp:
    image: memos-api:local
    container_name: shadow-memos-mcp
    command: ["python", "examples/mem_mcp/simple_fastmcp_serve.py", "--transport", "http", "--host", "0.0.0.0", "--port", "8003"]
    environment:
      PYTHONPATH: /app/src
      MEMOS_API_BASE_URL: http://memos-api:8000/product
    depends_on: [memos-api]
    restart: unless-stopped
    networks: [shadow]

  # 杞婚噺 embedding锛?026-08-26 鏇夸唬 ollama锛夛細鍋?ollama 鍗忚锛?api/embed + /api/tags锛夛紝
  # 鍚庣 fastembed ONNX CPU 路 multilingual-e5-large锛?024d 澶氳瑷€锛屼笌浼楃敓鍐岀‖缂栫爜缁村害涓€鑷达級銆?  # 闀滃儚鑷甫妯″瀷锛岃繍琛屾椂绂荤嚎銆備簯绔妗堬細EMBED_OPENAI_BASE_URL 鎸囧悜 dashscope/纭呭熀娴佸姩
  # 绛?OpenAI 鍏煎绔偣鍗宠蛋浜戠锛堢函 CPU 浜戞満鍙渷 2.2GB 妯″瀷锛夈€?
  embed:
    build:
      context: ../embed
    image: mc-embed:1.0
    container_name: shadow-embed
    environment:
      EMBED_MODEL: intfloat/multilingual-e5-large
      FASTEMBED_CACHE: /data/fastembed
      # 浜戠妯″紡绀轰緥锛堜簩閫変竴锛岀暀绌?鏈湴 ONNX锛夛細
      # EMBED_OPENAI_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      # EMBED_OPENAI_MODEL: text-embedding-v4
      # EMBED_OPENAI_API_KEY: sk-xxx
    volumes:
      - ./embed-data:/data
    restart: unless-stopped
    networks: [shadow]

  # vllm 鎼棰勬锛氶粯璁や笉璧凤紙GPU 鏄惧瓨鍗曚唤锛岀幇褰?vllm-qwen38-ara 鍗犵敤涓級銆?  # 鏁存満杩佺Щ鏃讹細docker compose --env-file shadow.env --profile gpu up -d vllm
  # 锛堥』鍏堝仠鎺夊師 vllm 瀹瑰櫒锛涙ā鍨嬪嵎 ara-nvfp4 + 缂栬瘧缂撳瓨鍗烽殢 docker 鍗疯縼绉伙級
  vllm:
    profiles: ["gpu"]
    image: vllm/vllm-openai:qwen38-x86_64-cu130
    container_name: shadow-vllm
    command: ["--model", "/models", "--served-model-name", "qwen3.8-27b-uncensored", "qwen3.8-27b-unc", "qwen3.8-27b", "qwen3.8", "qwen3.6-27b", "--max-model-len", "262144", "--kv-cache-dtype", "fp8", "--gpu-memory-utilization", "0.75", "--max-num-seqs", "64", "--speculative-config", "{\"method\":\"mtp\",\"num_speculative_tokens\":3}", "--enable-auto-tool-choice", "--tool-call-parser", "qwen3_coder", "--reasoning-parser", "qwen3"]
    environment:
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
    volumes:
      - ara-nvfp4:/models:ro
      - vllm_compile_cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    networks: [shadow]

  # viaproxy 服务定义已于 2026-08-31 清理：终局定谳=基岩入口宿主直跑
  # （Docker Desktop 的 UDP 端口发布到不了宿主，见上方 2026-08-26 定局注释；
  # 生产=计划任务 ViaProxy-Bedrock-Entry + ops/docker/shadow/viaproxy/start-viaproxy.bat）。

networks:
  shadow:
    name: shadow_net

volumes:
  ara-nvfp4:
    external: true
  vllm_compile_cache:
    external: true
  roadweaver-data: {}

