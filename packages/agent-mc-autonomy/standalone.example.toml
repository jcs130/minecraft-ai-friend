# Copy to config.local.toml; importing or checking never starts the game.
[runtime]
mode = "external"
data_directory = "" # Use the SAME absolute root in any optional observer/frontend.

[autonomy]
enabled = false
max_decisions = 0 # Run until explicit stop/error; set a positive number for a bounded trial.
max_tool_rounds = 6
context_tokens = 32768
max_output_tokens = 1024
model_timeout_seconds = 180

[server]
host = ""
port = 25565
username = ""
auth = "offline"
version = "1.21.1"

[backend]
node = "node"
directory = "" # Absolute verified backend installation directory.
body_config_file = "" # Optional absolute private JSON for an explicit alternative MCP backend.

[viewer]
renderer_directory = ""
catalog_file = ""
listen_port = 28985
auto_open = true # A configured viewer opens only after the game is connected.
url = ""
port = 0
console_port = 0

# Omit this table when using --queue-only. No model is discovered automatically.
[planner]
base_url = "" # Explicit OpenAI-compatible API base, including /v1 where required.
model = ""
api_key_env = "" # Environment variable name only; blank permits an anonymous local endpoint.
output_parameter = "max_tokens" # Or max_completion_tokens, as required by your provider.
image_input = false # Explicit capability; do not guess from the model name.

[perception]
enabled = true

[fast]
mode = "rules" # system_one enables an explicitly configured local/remote provider.
endpoint = ""
model = ""
api_key_env = ""
min_confidence = 0.75

# Optional strategic host port. The native runtime still works without a consumer.
[review]
enabled = false
min_interval_seconds = 60
review_interval_seconds = 180

[memory]
mode = "local" # local | vector | remote; the canonical core implements retrieval.
endpoint = "" # Vector: full embeddings URL. Remote: memory API base URL.
model = ""
api_key_env = "" # Environment variable name, never a literal secret.
timeout_ms = 3000
provider = "http" # http | mem0-oss | mem0-platform | bailian | powercontext
library_id = ""
project_id = "agent-mc"
scope_id = "" # Existing PowerContext Scope. No discovery or automatic creation.
search_mode = "text" # PowerContext: text | vector | hybrid.
learning_enabled = false # Optional PowerContext / HTTP game evidence and reviewed experience workflows.
