[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-mc-autonomy"
version = "0.2.98"
description = "Host-neutral autonomous Minecraft planner, native queue coordinator and strategic review port"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = ["mcp==2.1.1", "httpx>=0.27,<1", "openai>=1,<3", "jsonschema>=4.20,<5", "referencing>=0.30,<1"]

[project.optional-dependencies]
context = ["tokenizers>=0.23,<0.24", "Jinja2>=3.1,<4"]
auth = ["keyring>=25,<26", "PyJWT[crypto]>=2.10,<3"]
google = ["google-auth[requests]>=2.40,<3"]

[project.scripts]
agent-mc-autonomy = "agent_mc_autonomy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_mc_autonomy = ["integrations/*.mjs"]
"agent_mc_autonomy.core_distribution" = ["*.mjs", "*.json", "*.md", "LICENSE*.txt"]
"agent_mc_autonomy.runtime_bundle" = ["*.mjs", "*.cmd"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
