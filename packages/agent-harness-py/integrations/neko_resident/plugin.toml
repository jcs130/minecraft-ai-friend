[plugin]
id = "neko_resident"
name = "千灯纪"
description = "登录官网后使用原游戏角色，连接车万女仆或 Numen 玩家身体。"
version = "0.4.0"
entry = "plugin.plugins.neko_resident:ResidentPlugin"

[plugin.author]
name = "千灯纪"

[plugin.sdk]
recommended = ">=0.1.0,<0.3.0"
supported = ">=0.1.0,<0.3.0"

[plugin_runtime]
enabled = true
auto_start = true

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "千灯纪"
entry = "ui/panel.tsx"
mode = "hosted-tsx"
context = "resident_connection"
permissions = ["state:read", "action:call"]

[resident]
role = ""
session_file = ""
