version: 1

repowiki:
  template: architecture
  notes:
    - text: "项目定位：本机 Minecraft 多 Agent 共生服务器（MC 1.21.1 / NeoForge 21.1.248 / Java 21），真人玩家与四类自主 Agent 共享同一世界。不要描述为单一 bot 或单一模组。"
    - text: "四类 Agent 必须各自成页且不可混淆：房主·灯语女神（世界管理，world 服务 + QwenPaw 角色 game:mc-god）、开发运营团队（QwenPaw 单实例 10 角色，world/ops）、自主生存·桐人（survivor 服务，world/survival）、女仆妖精·结衣/Yui（车万女仆模组，world/maid-bridge-src + world/sidecar/maid_agent_api.py）。"
    - text: "当前为 13 个活动 Docker 服务（见 compose.yml）：mc、world、gate、panel、control、inventory、npc、resources、qwenpaw、survivor、voice、asr、tts。qwenpaw-ops（宿主端口 18090）在 compose 保留定义但已归档、未运行——不要当作活动服务。"
    - text: "运营角色权威源是 world/ops/world_team.py 的 MEMBERS 与 world/ops/world_team_schedule.py 的 SCHEDULES；运营团队已从早期『6 角色独立 qwenpaw-ops 实例』合并为『游戏 QwenPaw 单实例 10 角色』。config/operations-team-plan.json 是过时的 proposal_only（旧 6 角色/18090/旧镜像），不要当作现状。"
    - text: "房主女神世界引擎入口是 world/bootstrap-world.mts（tsx 单进程，手动装配 world/src 下的 mc-* TS 服务），独占 RCON 并以名为 Goddess 的 mineflayer 观察者 bot 入驻；天神之眼渲染由该进程的 modern-viewer 提供（宿主 19092），管理台 panel 是独立只读服务（宿主 19091）。"
    - text: "自主生存 Agent 核心是 world/survival/controller.py 的 tick 主循环，含自适应 LLM 路由（adaptive_router.py，4 级双系统，按不确定性决定是否调用模型）与模式检测/技能结晶『熟能生巧』（pattern_detector.py）；动作经 numen_gateway.py 落地。"
    - text: "部署/重启权威规则：必须走 control 服务的 /plan+/execute 回执通道（world/admin/control-service.mjs，容器内 3090，自动 mc save-all、依赖序、健康门、持久回执），不要用裸 docker restart。Python/JS 代码经 bind mount 进容器，上线只需宿主检出 + 重启受影响容器；详见 docs/deploy-release-runbook.md。"
    - text: "当前客户端分发包以 reports/pack-export.json 为权威（0.1.5，88 JAR，MC 1.21.1/NeoForge 21.1.248）；旧 0.1.4 数据已过时，历史阶段验收见 docs/INTEGRATION-HISTORY.md。"
    - text: "外部 Agent 接入有两条路径：Numen stdio MCP 桥（tools/run_numen_mcp.py，MC 25567 / RCON 25577，身体经 numen_act summon 召唤）或经 gate 的原版协议网关（world/src/neoforge-handshake/gate.cjs，宿主 25701）。"
    - text: "自研 NeoForge 模组源码在 world/*-src/（botgate、maid-bridge、irons-bridge、god-voice、chanting-items、client-controls），编译后载入 mc，不是独立 Docker 服务。"
    - text: "女仆妖精结衣/Yui 是不死伴侣（伴侣保护），与桐人组成两人小队（world/sidecar/party_config.py）：桐人自主游玩成长，结衣负责陪伴/家庭与管理救援、不替桐人游玩。"

  documents:
    - title: "项目总览与多 Agent 架构"
      parent: ""
      goal: "说明项目定位、四类 Agent 分工、13 个活动服务拓扑与整体数据流，给出阅读其余页面的导航。"
      hints: "README.md, compose.yml, docs/GAME-RUNTIME-LAYOUT.md, docs/ARCHITECTURE.md"
    - title: "房主·灯语女神与世界引擎"
      parent: ""
      goal: "讲清 world 服务如何以 Goddess 观察者 bot + 独占 RCON 管理世界，bootstrap-world.mts 装配的 mc-* TS 服务，以及天神之眼渲染与管理台的关系。"
      hints: "world/bootstrap-world.mts, world/src, world/admin/eye-service.mts, world/admin/server.mjs"
    - title: "开发运营 Agent 团队（QwenPaw）"
      parent: ""
      goal: "梳理游戏 QwenPaw 单实例的 10 个角色职责、班次 cron 串行机制、司灯/天神/公会策划分工，以及与工程仓库 engineering/repo 的关系。"
      hints: "world/ops/world_team.py, world/ops/world_team_schedule.py, world/ops/learning_service.py, world/survival/game_service.py, docs/OPERATIONS-TEAM.md"
    - title: "自主生存 Agent · 桐人（survivor）"
      parent: ""
      goal: "解析 survivor 服务的 controller tick 主循环、感知→决策→动作流程、身体自愈与成长，以及经 Numen 网关落地动作。"
      hints: "world/survival/service.py, world/survival/controller.py, world/survival/numen_gateway.py, docs/AUTONOMOUS-SURVIVOR.md"
    - title: "自适应路由与技能结晶（熟能生巧）"
      parent: "自主生存 Agent · 桐人（survivor）"
      goal: "说明 4 级双系统自适应 LLM 路由如何按不确定性决定是否调用模型，以及模式检测与技能结晶如何把重复行为固化为程序化技能。"
      hints: "world/survival/adaptive_router.py, world/survival/pattern_detector.py, docs/FAST-SLOW-AGENT-SYSTEM.md"
    - title: "女仆妖精 Agent · 结衣（Yui）"
      parent: ""
      goal: "讲清基于车万女仆模组的辅助妖精伴侣：maid-bridge 模组桥、maid_agent_api 适配 QwenPaw 角色、伴侣保护/救援，以及与桐人的两人小队职责划分。"
      hints: "world/maid-bridge-src, world/sidecar/maid_agent_api.py, world/sidecar/party_config.py, docs/MAID-AGENTS-DESIGN.md, docs/YUI-AUTONOMOUS-LIFE.md"
    - title: "村民/NPC 与公会引擎"
      parent: ""
      goal: "解析 mc_npc.py 村民引擎（裸 RCON、模板化零 LLM 对话、每日任务、三通道交易、技能书施法）与公会库存/请求/规则/结算链。"
      hints: "world/sidecar/mc_npc.py, world/sidecar/mc_guild.py, world/sidecar/guild_rules.py, docs/NPC-INTEGRATION.md"
    - title: "基础设施与服务拓扑"
      parent: ""
      goal: "列出 13 个 Docker 服务的镜像、职责、宿主端口与依赖关系，重点讲 gate/panel/control/inventory/voice/asr/tts/resources 各自角色。"
      hints: "compose.yml, world/src/neoforge-handshake/gate.cjs, world/admin/server.mjs, world/admin/control-service.mjs, tools/inventory_service.py"
    - title: "部署与运维（control 回执通道）"
      parent: "基础设施与服务拓扑"
      goal: "说明 /plan+/execute 重启流程、mc save-all、依赖序、健康门、持久回执与发布锚规则，强调不要用裸 docker restart。"
      hints: "world/admin/control-service.mjs, docs/deploy-release-runbook.md"
    - title: "外部 Agent 接入（Numen 与 gate）"
      parent: "基础设施与服务拓扑"
      goal: "对比 Numen stdio MCP 桥与原版协议网关两条接入路径、身体召唤机制与端口。"
      hints: "tools/run_numen_mcp.py, config/numen-mcp.example.json, world/src/neoforge-handshake/gate.cjs, docs/NUMEN-MCP.md"
    - title: "玩法系统：技能·言灵·女仆语音"
      parent: ""
      goal: "梳理 8 项特色秘术/技能罗盘/原生铁魔法/传送阵，言灵法杖与语音链（voice/asr/tts Kokoro）的分工与入口。"
      hints: "docs/SKILLS-UNIFIED-CLI.md, docs/STAFF-CHANTING-DESIGN.md, world/irons-bridge-src, world/chanting-items-src, world/tts/tts_api.py"
    - title: "客户端分发包与兼容性"
      parent: ""
      goal: "说明 dist 导出包、pack-export 校验、注册表兼容与内容修复数据包的构建与分发。"
      hints: "reports/pack-export.json, docs/CLIENT-REGISTRY-COMPATIBILITY.md, tools/export_pack.py, content/datapacks/qiandeng_fixes"

knowledgecard:
  notes:
    - text: "模块边界按 world/ 子目录划分：world/src（TS 世界引擎 + gate）、world/admin（panel/control/eye 管理面）、world/ops（Python 运营/QwenPaw 治理/MCP）、world/sidecar（Python NPC/女仆/公会/语音 sidecar）、world/survival（自主生存 Agent）、world/tts（Kokoro TTS）、world/*-src（NeoForge 模组源）。"
    - text: "world/sidecar 内区分两条线：村民/NPC 引擎（mc_npc.py，裸 RCON、模板化零 LLM）与女仆妖精 Agent（maid_agent_api.py 等 maid_* + party_*，走 QwenPaw 角色 qd-maid-dialogue）。不要合并成一个模块。"
    - text: "运营团队角色不要与游戏内 Agent 混淆：天神/工程师(qd-engineer)改源码跑测试，司灯(qd-steward)做协调台账，公会策划(qd-guild-planner)做内容；房主女神(game:mc-god)是世界管理权威，不同于 operations:mc-god(天神)。"
    - text: "survivor 与 Yui 是两人小队（world/sidecar/party_config.py）：桐人自主游玩成长，结衣为不死伴侣/管理救援、不替桐人游玩；描述 party 时保持这一职责划分。"
