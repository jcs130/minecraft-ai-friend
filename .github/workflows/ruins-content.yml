name: ruins-content
on:
  pull_request:
    paths: ['paper/content/ruins-expansion/**', '.github/workflows/ruins-content.yml']
  push:
    branches: [main]
    paths: ['paper/content/ruins-expansion/**', '.github/workflows/ruins-content.yml']
jobs:
  content-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r paper/content/ruins-expansion/requirements.txt
      - run: python -m unittest discover -s paper/content/ruins-expansion/tests -v
