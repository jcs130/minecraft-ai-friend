name: Agent MC Autonomy
on:
  push:
    paths: ['packages/agent-mc-autonomy/**', '.github/workflows/agent-mc-autonomy.yml']
  pull_request:
    paths: ['packages/agent-mc-autonomy/**', '.github/workflows/agent-mc-autonomy.yml']
jobs:
  offline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent-mc-autonomy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install . pytest ruff==0.12.4 build
      - run: python -m pytest -q
      - run: ruff check --select E4,E7,E9,F,I src tests
      - run: python -m build --wheel
