name: Public source and self-host build
on:
  push:
    branches: [main, qiandengji-personal-stash, publish/main-qiandengji-20261023]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - name: Check Goddess private-message authority without connecting
        run: node --test paper/ops/goddess-*.test.mjs
      - name: Check native Java LAN discovery without advertising a QA server
        run: node --test paper/ops/java-lan-discovery.test.mjs
      - name: Check activity countdown meaning and scoped identity
        run: python paper/ops/test-activity-bars.py
      - name: Check protected navigation-only dungeon entrances
        run: python paper/ops/test-dungeon-entrance.py
      - name: Check training reward progression and ordinary-difficulty caps
        run: python paper/ops/test-trial-reward-balance.py
      - name: Check player menu navigation and single-use responses
        run: python paper/ops/test-player-ui.py
      - name: Check optional maid adapter without connecting
        run: |
          node --test paper/integrations/touhou-maids/tests/maid-port.test.mjs
          node --check paper/integrations/touhou-maids/tests/agent-operations.mjs
          node --check paper/integrations/touhou-maids/tests/agent-failures.mjs
          node --check paper/integrations/touhou-maids/tests/lifecycle-stage.mjs
          curl --fail --silent --show-error --location --retry 2 https://repo.maven.apache.org/maven2/com/google/code/gson/gson/2.10.1/gson-2.10.1.jar --output "$RUNNER_TEMP/maid-life-gson.jar"
          python paper/integrations/touhou-maids/tests/run-lifecycle-ledger.py --gson "$RUNNER_TEMP/maid-life-gson.jar"
          python paper/integrations/touhou-maids/tests/run-close-follow.py
          node --check paper/integrations/touhou-maids/tests/close-follow-stage.mjs
          node --check paper/integrations/touhou-maids/tests/follow-radius-stage.mjs
          python -m unittest discover -s paper/integrations/touhou-maids/tests -p test_harness_gateway.py -v
          node --check paper/integrations/touhou-maids/tests/brain-harness-stage.mjs
          node --check paper/integrations/touhou-maids/tests/social-stage.mjs
          python paper/integrations/touhou-maids/tests/run-conversation-rules.py
          python paper/integrations/touhou-maids/tests/run-companion-rules.py --gson "$RUNNER_TEMP/maid-life-gson.jar"
          node --check paper/integrations/touhou-maids/tests/companion-stage.mjs
          node --check paper/integrations/touhou-maids/tests/conversation-stage.mjs
          node --check paper/integrations/touhou-maids/tests/short-dialogue-stage.mjs
          node --check paper/integrations/touhou-maids/tests/dialogue-once-stage.mjs
          node --check paper/integrations/touhou-maids/tests/dialogue-once-public-log.mjs
          node --check paper/integrations/touhou-maids/tests/svc-receiver.mjs
          node --check paper/integrations/touhou-maids/tests/voice-patrol-stage.mjs
      - name: Check native camera launch and appearance archives without connecting
        run: |
          python -m unittest discover -s paper/integrations/native-camera -p test_prepare_neoforge.py -v
          node --test paper/ops/native-photo-renderer.test.mjs paper/ops/photo-scene-maid.test.mjs
      - name: Check four-agent party diagnostics and isolated-stage boundaries offline
        run: |
          python paper/integrations/vortex-rpg/tests/run-four-party.py
          python paper/integrations/vortex-rpg/tests/test_four_party_build.py
          python paper/integrations/vortex-rpg/tests/test_party4_diagnostics.py
          node --test paper/integrations/vortex-rpg/tests/four-party-preflight.test.mjs
          node --check paper/integrations/vortex-rpg/tests/four-party-stage.mjs
      - name: Check restore, drain and original Minescript wrappers offline
        run: |
          python -m unittest discover -s tests -p test_survival_body_reconnect.py -v
          python -m unittest discover -s tests -p test_survival_body_selfheal.py -v
          python -m unittest discover -s packages/agent-mc-java-bridge/tests -p test_minescript_utf8.py -v
      - name: Compile original cancellation and task-persistence regression fixtures
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://repo.maven.apache.org/maven2/com/google/code/gson/gson/2.10.1/gson-2.10.1.jar -o "$RUNNER_TEMP/gson-2.10.1.jar"
          printf '%s  %s\n' '4241c14a7727c34feea6507ec801318a3d4a90f070e4525681079fb94ee4c593' "$RUNNER_TEMP/gson-2.10.1.jar" | sha256sum --check
          python tests/verify_issue43_java.py --jdk "$JAVA_HOME" --gson "$RUNNER_TEMP/gson-2.10.1.jar" --output "$RUNNER_TEMP/review-boundaries"
      - name: Check bidirectional voice authorization and client receipts offline
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/voice-deps"
          curl --proto '=https' --tlsv1.2 -fsSL https://fill-data.papermc.io/v1/objects/fe53021f3168322cb6cb68f78699866fd098df3c306e4359847a10b0d02689ef/velocity-3.4.0-SNAPSHOT-563.jar -o "$RUNNER_TEMP/voice-deps/velocity.jar"
          curl --proto '=https' --tlsv1.2 -fsSL https://cdn.modrinth.com/data/tL0SCXYq/versions/reFUiAdB/LibreLogin.jar -o "$RUNNER_TEMP/voice-deps/LibreLogin.jar"
          curl --proto '=https' --tlsv1.2 -fsSL https://cdn.modrinth.com/data/HYKaKraK/versions/QrZrSKnd/packetevents-velocity-2.8.0.jar -o "$RUNNER_TEMP/voice-deps/packetevents.jar"
          python paper/integrations/login-guard/tests/run_transport_tests.py --deps "$RUNNER_TEMP/voice-deps" --output "$RUNNER_TEMP/voice-transport-tests"
          node --test paper/integrations/proximity-voice/tests/client.test.mjs paper/integrations/proximity-voice/tests/trace-client.test.mjs
          node --test paper/ops/tests/agent-vision-acceptance.test.mjs
          node --check paper/integrations/proximity-voice/tests/upload-recovery-stage.mjs
          node --check paper/integrations/login-guard/tests/protocol/voice-chunks.mjs
          mkdir "$RUNNER_TEMP/voice-upload-failure"
          javac --release 21 -d "$RUNNER_TEMP/voice-upload-failure" paper/integrations/proximity-voice/src/dev/god/godvoice/VoiceUploads.java paper/integrations/proximity-voice/src/dev/god/godvoice/VoiceUploadTrace.java paper/integrations/proximity-voice/tests/VoiceUploadFailureTest.java paper/integrations/proximity-voice/tests/VoiceUploadTraceTest.java
          java -cp "$RUNNER_TEMP/voice-upload-failure" dev.god.godvoice.VoiceUploadFailureTest
          java -cp "$RUNNER_TEMP/voice-upload-failure" dev.god.godvoice.VoiceUploadTraceTest
  source-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python tools/check_public_source.py
      - run: python -m unittest discover -s paper/ops/tests -p test_geyser_port_mappings.py -v
      - run: python -m unittest discover -s paper/ops/tests -p test_background_console_flags.py -v
      - run: python -m unittest discover -s paper/ops/tests -p test_city_gate_regions.py -v
      - run: python -m unittest discover -s paper/ops -p test_native_auth_inputs.py -v
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s paper/ops/tests -p test_dungeon_content_merge.py -v
      - run: python paper/ops/world-activity.test.py
      - run: python paper/ops/goddess_chat_review.test.py
      - run: python paper/ops/goddess-evolution.test.py
      - run: python paper/ops/agentfriend_state.test.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p test_self_host.py -v
      - run: node --test paper/ops/ysm-services.test.mjs
      - run: python -m unittest discover -s tests -p test_agent_skill.py -v
      - name: Scan current tree without printing credential values
        shell: bash
        run: |
          if ! curl --proto '=https' --tlsv1.2 --retry 4 --retry-delay 3 --max-time 90 -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"; then
            curl --proto '=https' --tlsv1.2 --retry 3 --retry-delay 3 --max-time 90 -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz?download=1&ci=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          fi
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          set +e
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact=100 --max-archive-depth=2 --no-banner --log-level=error --report-format=json --report-path="$RUNNER_TEMP/gitleaks-redacted.json" > "$RUNNER_TEMP/gitleaks-private.log" 2>&1
          scan_status=$?
          set -e
          python - "$RUNNER_TEMP/gitleaks-redacted.json" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          rows=json.loads(p.read_text()) if p.exists() else []
          print(json.dumps({'findings':len(rows),'locations':[{'file':r.get('File'),'line':r.get('StartLine'),'rule':r.get('RuleID')} for r in rows],'valuesPrinted':False}))
          PY
          exit "$scan_status"
  compile-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - run: python paper/self-host/selfhost.py doctor
      - name: Prepare public compile inputs only (no game process)
        run: python paper/self-host/selfhost.py prepare --directory "$RUNNER_TEMP/paper-inputs" --accept-eula
      - run: python paper/self-host/selfhost.py build --directory "$RUNNER_TEMP/paper-inputs" --output "$RUNNER_TEMP/plugin-build"
      - name: Compile the independent read-only observation plugin
        run: python paper/integrations/world-observer/build.py --server "$RUNNER_TEMP/paper-inputs" --jdk "$JAVA_HOME" --output "$RUNNER_TEMP/observer-build"
      - name: Check bounded CLI help and query contracts
        run: python paper/plugins/AgentFriend/tests/run_cli_tests.py --inputs "$RUNNER_TEMP/paper-inputs" --build "$RUNNER_TEMP/plugin-build" --output "$RUNNER_TEMP/cli-tests"
      - name: Dungeon examination completion regression
        run: python paper/plugins/AgentFriend/tests/run_exam_completion_tests.py --jdk "$JAVA_HOME" --output "$RUNNER_TEMP/exam-completion-tests"
      - name: Independent bounded recycle quotes
        run: python paper/plugins/AgentFriend/tests/run_recycle_quotes.py --jdk "$JAVA_HOME"
      - name: Exact maid identity and Bedrock allay fallback
        run: python paper/integrations/touhou-maids/tests/run-bedrock-visual-rules.py --jdk "$JAVA_HOME"
      - name: Check native and vanilla decoder capability boundaries without connecting
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/payload-policy-tests"
          javac --release 21 -encoding UTF-8 -d "$RUNNER_TEMP/payload-policy-tests" paper/integrations/optional-payload-guard/src/org/qiandengji/payload/OptionalPayloadPolicy.java paper/integrations/optional-payload-guard/src/org/qiandengji/payload/YsmAcknowledgementHandoff.java paper/integrations/optional-payload-guard/tests/org/qiandengji/payload/OptionalPayloadPolicyTest.java paper/integrations/optional-payload-guard/tests/org/qiandengji/payload/YsmAcknowledgementHandoffTest.java
          java -ea -cp "$RUNNER_TEMP/payload-policy-tests" org.qiandengji.payload.OptionalPayloadPolicyTest
          java -ea -cp "$RUNNER_TEMP/payload-policy-tests" org.qiandengji.payload.YsmAcknowledgementHandoffTest
  backup-path-compatibility:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Windows PowerShell backup paths without running maintenance
        shell: powershell
        run: ./paper/scripts/test-backup-long-path.ps1
      - name: Check maintenance snapshot retention and failure recovery in isolation
        shell: powershell
        run: |
          ./paper/ops/tests/release-snapshot-retention.test.ps1
          ./paper/ops/tests/backup-retention-policy.test.ps1
  portal-release:
    runs-on: ubuntu-latest
    env:
      PORTAL_BROWSER_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install current portal source for candidate checks
        run: npm ci --ignore-scripts --no-audit
        working-directory: paper/integrations/agent-portal
      - name: Verify the explicit browser before running real UI checks
        run: test -x "$PORTAL_BROWSER_EXECUTABLE" && "$PORTAL_BROWSER_EXECUTABLE" --version
      - name: Check current portal and Skill download contracts
        run: node scripts/prepare-downloads.mjs --base-url https://qiandengji-downloads-hk-20261023.oss-cn-hongkong.aliyuncs.com/releases/
        working-directory: paper/integrations/agent-portal
      - name: Test current portal and Skill download contracts
        run: npm test
        working-directory: paper/integrations/agent-portal
      - name: Install the locked observation worker
        run: npm ci --ignore-scripts --no-audit
        working-directory: paper/integrations/world-observer
      - name: Check observation leases and lifecycle boundaries
        run: npm test
        working-directory: paper/integrations/world-observer
      - name: Check web gameplay RTC input, receipt and fallback boundaries
        run: node --test paper/integrations/web-play-rtc/test/*.test.mjs
      - run: python paper/self-host/selfhost.py export-portal --directory "$RUNNER_TEMP/own-game" --output "$RUNNER_TEMP/portal"
      - run: npm ci --no-audit
        working-directory: ${{ runner.temp }}/portal
      - run: npm test
        working-directory: ${{ runner.temp }}/portal
  agent-mc-core:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    defaults:
      run:
        working-directory: packages/agent-mc-world
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: corepack pnpm build:engine
      - name: Check minimal crypt geometry patch and guarded rollback
        run: node --test ../../paper/ops/crypt-connector-region.test.mjs
      - name: Install the shared portal utilities for isolated hosting checks
        run: npm ci --ignore-scripts --no-audit
        working-directory: paper/integrations/agent-portal
      - name: Check Numen hosting, ownership, BYOK and conversation boundaries
        run: node --test test/*.test.mjs
        working-directory: paper/integrations/numen-hosting
      - run: corepack pnpm exec vitest run tests/procedure-ipc.test.ts --maxWorkers=1 --minWorkers=1
      - run: corepack pnpm exec vitest run --maxWorkers=1 --minWorkers=1
