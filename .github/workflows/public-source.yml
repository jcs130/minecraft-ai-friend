name: Public source and self-host build
on:
  push:
    branches: [main, qiandengji-personal-stash, publish/main-qiandengji-20261023]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python tools/check_public_source.py
      - run: python -m unittest discover -s tests -p test_self_host.py -v
      - name: Scan current tree without printing credential values
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          set +e
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact=100 --max-archive-depth=2 --no-banner --log-level=error --report-format=json --report-path="$RUNNER_TEMP/gitleaks-redacted.json" > "$RUNNER_TEMP/gitleaks-private.log" 2>&1
          scan_status=$?
          set -e
          python - "$RUNNER_TEMP/gitleaks-redacted.json" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          rows=json.loads(p.read_text()) if p.exists() else []
          print(json.dumps({'findings':len(rows),'locations':[{'file':r.get('File'),'line':r.get('StartLine'),'rule':r.get('RuleID')} for r in rows],'valuesPrinted':False}))
          PY
          exit "$scan_status"
  compile-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - run: python paper/self-host/selfhost.py doctor
      - name: Prepare public compile inputs only (no game process)
        run: python paper/self-host/selfhost.py prepare --directory "$RUNNER_TEMP/paper-inputs" --accept-eula
      - run: python paper/self-host/selfhost.py build --directory "$RUNNER_TEMP/paper-inputs" --output "$RUNNER_TEMP/plugin-build"
  portal-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python paper/self-host/selfhost.py export-portal --directory "$RUNNER_TEMP/own-game" --output "$RUNNER_TEMP/portal"
      - run: npm ci --no-audit
        working-directory: ${{ runner.temp }}/portal
      - run: npm test
        working-directory: ${{ runner.temp }}/portal
  agent-mc-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/agent-mc-world
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - run: corepack pnpm build:engine
      - run: corepack pnpm exec vitest run --maxWorkers=2 --minWorkers=1
