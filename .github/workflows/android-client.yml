name: Android client import pack
on:
  pull_request:
    paths:
      - 'paper/integrations/android-client/**'
      - 'paper/integrations/agent-portal/src/android-client-downloads.json'
      - '.github/workflows/android-client.yml'
  push:
    branches: [main]
    paths:
      - 'paper/integrations/android-client/**'
      - 'paper/integrations/agent-portal/src/android-client-downloads.json'
      - '.github/workflows/android-client.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build from reviewed original inputs
        run: python paper/integrations/android-client/build.py --cache "$RUNNER_TEMP/android-inputs" --output "$RUNNER_TEMP/android-release"
      - name: Verify actual pack, audio SPI and website checksum
        run: >-
          python paper/integrations/android-client/verify.py
          --pack "$RUNNER_TEMP/android-release/qiandengji-android-1.21.1-neoforge-1.0.0-preview.1.mrpack"
          --cache "$RUNNER_TEMP/android-inputs"
          --catalog paper/integrations/agent-portal/src/android-client-downloads.json
      - name: Check download routes and phone browser layouts
        working-directory: paper/integrations/agent-portal
        env:
          PORTAL_UI_ARTIFACT_DIR: ${{ runner.temp }}/android-release/browser-review
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/android-client-download.test.mjs tests/android-client-browser.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qiandengji-android-client-preview
          path: ${{ runner.temp }}/android-release/
          if-no-files-found: error
          retention-days: 30
