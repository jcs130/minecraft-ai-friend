name: Assemble verified preview.117 archive
on:
  push:
    branches: [release/qa-preview117-ingest-20261121]
    paths: [.releases/four-body-sdk/**]
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify and stage the exact reviewed SDK archive
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "jcs130/minecraft-ai-friend" ]]
          [[ "$GITHUB_REF" == "refs/heads/release/qa-preview117-ingest-20261121" ]]
          out=packages/agent-mc-autonomy/src/agent_mc_autonomy/core_distribution/agent-mc-world-0.5.7-rc.160-preview.117.tgz
          cat .releases/four-body-sdk/part{0,1,2,3} > "$out"
          [[ "$(wc -c < "$out")" == 4604707 ]]
          echo "1d42513ca112c62fab99b554c185ad10b7d3f506f635fcf82effb9378a1ad2be  $out" | sha256sum -c -
          [[ "$(git hash-object "$out")" == fe6b2873849e6eab471ad1a9dba675e3646592b7 ]]
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$out"
          git commit -m "Stage the verified preview.117 Git blob"
          git push origin HEAD:refs/heads/release/qa-preview117-ingest-20261121
