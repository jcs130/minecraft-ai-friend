name: Unified server NPC
on:
  pull_request:
    paths:
      - 'packages/agent-harness-py/**'
      - 'packages/agent-memory/graphiti-sidecar/**'
      - 'paper/integrations/unified-npc/**'
      - '.github/workflows/unified-npc.yml'
  push:
    branches: [main]
    paths:
      - 'packages/agent-harness-py/**'
      - 'packages/agent-memory/graphiti-sidecar/**'
      - 'paper/integrations/unified-npc/**'
permissions:
  contents: read
jobs:
  lifecycle-memory-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e './packages/agent-harness-py[dev,numen]' -e './packages/agent-memory/graphiti-sidecar[test,falkordb]' nbtlib==2.0.4
      - name: Identity, receipts, memory and cold migration
        run: python -m pytest -q packages/agent-harness-py/tests packages/agent-memory/graphiti-sidecar/tests paper/integrations/unified-npc
