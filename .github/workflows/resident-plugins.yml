name: Resident desktop plugins

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/resident-plugins.yml'
      - 'LICENSE'
      - 'packages/agent-harness-py/integrations/**'
      - 'paper/integrations/agent-portal/src/resident-downloads.json'
      - 'paper/integrations/agent-portal/src/download-catalog.mjs'
      - 'paper/integrations/agent-portal/scripts/download-manifest.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/resident-plugins.yml'
      - 'LICENSE'
      - 'packages/agent-harness-py/integrations/**'
      - 'paper/integrations/agent-portal/src/resident-downloads.json'
      - 'paper/integrations/agent-portal/src/download-catalog.mjs'
      - 'paper/integrations/agent-portal/scripts/download-manifest.mjs'

permissions:
  contents: read

jobs:
  build:
    # N.E.K.O. includes the OS, CPU architecture and Python minor version in plugin metadata.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Check out the packaging SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Project-N-E-K-O/N.E.K.O
          ref: fb2a2e731a8c954478d08678b0c8cf40e8145a54
          path: neko-sdk
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          architecture: x64

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2' # Bundles npm 10.9.8, used for the reviewed tarballs.

      - name: Install locked SDK dependencies
        run: |
          python -m pip install uv==0.12.13
          uv sync --project neko-sdk --locked --no-dev --no-install-project --python (Get-Command python).Source

      - name: Build N.E.K.O. plugin
        run: |
          New-Item -ItemType Directory -Path resident-packages | Out-Null
          $catalog = Get-Content paper/integrations/agent-portal/src/resident-downloads.json -Raw | ConvertFrom-Json
          $filename = ($catalog | Where-Object id -eq 'resident-neko').filename
          neko-sdk/.venv/Scripts/python.exe packages/agent-harness-py/integrations/pack_neko_resident.py --neko-sdk neko-sdk --out "resident-packages/$filename"

      - name: Build Cortico World API 5
        run: npm --prefix packages/agent-harness-py/integrations/cortico-resident run pack:api5 -- "$PWD/resident-packages"

      - name: Build Cortico World API 6
        run: npm --prefix packages/agent-harness-py/integrations/cortico-resident run pack:api6 -- "$PWD/resident-packages"

      - name: Verify packages against the website catalogue
        run: |
          node paper/integrations/agent-portal/scripts/download-manifest.mjs --resident-packages --package-directory resident-packages --base-url https://build.invalid/releases/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item paper/integrations/agent-portal/src/resident-downloads.json resident-packages/

      - name: Upload desktop installers and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qiandengji-resident-desktop
          path: resident-packages/
          if-no-files-found: error
          retention-days: 90
