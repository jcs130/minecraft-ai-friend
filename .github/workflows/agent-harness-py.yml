name: Python body adapters
on:
  pull_request:
    paths:
      - 'packages/agent-harness-py/**'
      - 'packages/agent-mc-autonomy/**'
      - 'paper/integrations/touhou-maids/agent/**'
      - '.github/workflows/agent-harness-py.yml'
  push:
    branches: [main]
    paths:
      - 'packages/agent-harness-py/**'
      - 'packages/agent-mc-autonomy/**'
      - 'paper/integrations/touhou-maids/agent/**'
      - '.github/workflows/agent-harness-py.yml'
permissions:
  contents: read
jobs:
  python-body-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install -e './packages/agent-mc-autonomy' -e './packages/agent-harness-py[dev,numen]'
      - name: Check native and owner-connection body boundaries
        working-directory: packages/agent-harness-py
        run: |
          python -m pytest -q tests/test_native_maid.py tests/test_contract.py tests/test_bodies.py tests/test_runtime.py
          python -m ruff check src/agent_mc_harness/bridges.py src/agent_mc_harness/body/maid.py tests/test_native_maid.py
          python -m mypy src/agent_mc_harness/bridges.py src/agent_mc_harness/body/maid.py
      - name: Check villager quest bridge
        working-directory: packages/agent-harness-py
        run: |
          python -m pytest -q tests/test_villager_quests.py tests/test_villager_service.py tests/test_native_villager.py
          python -m ruff check src/agent_mc_harness/quests tests/test_villager_quests.py
          python -m mypy src/agent_mc_harness/quests tests/test_villager_quests.py
