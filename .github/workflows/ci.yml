name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyyaml pytest
      - name: CI gate (migration regression / syntax / path anchors)
        run: python ops/ci_check.py

  unit:
    name: unit tests (pytest + node anchors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run pytest
        run: |
          pip install pytest
          pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run node tests (panel anchors + give whitelist sync + aura)
        run: node --test tests/js/panel-anchors.test.mjs tests/js/give-whitelist-sync.test.mjs tests/js/aura-family.test.mjs

  settlementsfix:
    name: settlementsfix (pure-logic javac + SkillChestTest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch gson (pinned 2.10.1, sha256 checked)
        run: |
          curl -fsSLO https://repo1.maven.org/maven2/com/google/code/gson/gson/2.10.1/gson-2.10.1.jar
          echo "4241c14a7727c34feea6507ec801318a3d4a90f070e4525681079fb94ee4c593  gson-2.10.1.jar" | sha256sum -c -
      - name: Compile pure logic + run SkillChestTest
        run: |
          export JDK21_BIN="$JAVA_HOME/bin"
          python settlementsfix-src/build.py --pure-only
